# Estándares que una máquina puede revisar (ESTANDARES.md, marcados ✅). «Un error que una máquina puede ver, se vuelve
# un check»: cuando algo se corrige dos veces y se puede detectar solo, se agrega aquí.
name: Revisar estándares

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  estandares:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      CUERPO: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Si cambió sa-nav.js o alma-client.js, su versión subió en las páginas
        run: |
          git fetch -q origin "$BASE"
          fallo=0
          for js in js/sa-nav.js js/alma-client.js; do
            if git diff --quiet "origin/$BASE"...HEAD -- "$js"; then continue; fi
            nombre=$(basename "$js")
            for pag in $(grep -rl --include=*.html "$nombre?v=" . | grep -v node_modules); do
              antes=$(git show "origin/$BASE:${pag#./}" 2>/dev/null | grep -o "$nombre?v=[^\"']*" | head -1)
              ahora=$(grep -o "$nombre?v=[^\"']*" "$pag" | head -1)
              if [ -n "$antes" ] && [ "$antes" = "$ahora" ]; then echo "::error file=$pag::Cambió $js pero $pag sigue cargando $ahora: sube el ?v= (si no, los teléfonos usan la versión vieja)"; fallo=1; fi
            done
          done
          exit $fallo

      - name: Cada sc-for de las páginas lee su lista con list= (support.js no conoce each=)
        # 3-nov: la ventana de «Acciones pendientes» usaba each= y salía vacía (la píldora decía 1, la lista 0).
        run: |
          if grep -rnE --include=*.html '<sc-for( [^>]*)?>' . | grep -v node_modules | grep -v 'list="'; then
            echo "::error::Un <sc-for> sin list=\"{{ … }}\" no pinta nada (js/support.js lee solo list)."; exit 1
          fi
          echo "Bien."

      - name: Ninguna llave en el código
        run: |
          git fetch -q origin "$BASE"
          if git diff "origin/$BASE"...HEAD -U0 | grep -E '^\+' | grep -E 'sk-ant-[a-z0-9]{3,}-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|xox[bap]-[0-9A-Za-z-]{20,}|EAA[A-Za-z0-9]{60,}'; then
            echo "::error::Hay algo que parece una llave en el cambio. Las llaves van en las Propiedades del script o en los secretos de GitHub."; exit 1
          fi
          echo "Sin llaves."

      - name: En el SQL del cerebro, hash va entre acentos graves (palabra reservada de BigQuery)
        run: |
          if grep -nE "(SELECT|WHERE|ARRAY_AGG|GROUP BY|ORDER BY|DELETE).*[^\`.a-zA-Z_]hash[^\`a-zA-Z_]" apps-script/cerebro*.js | grep -v '^[^:]*:[0-9]*: *\(/\*\|\*\)'; then
            echo "::error::Usa \`hash\` entre acentos graves en el SQL del cerebro: HASH es palabra reservada de BigQuery."; exit 1
          fi
          echo "Bien."

      - name: Las llamadas a internet pasan por uf_ (cuentan el cupo de Google)
        run: |
          if grep -nE 'UrlFetchApp\.fetch(All)?\(' apps-script/*.js | grep -v '^apps-script/cupo\.js:'; then
            echo "::error::Usa uf_(url, opciones, canal) o ufAll_(pedidos, canal) de apps-script/cupo.js: así la llamada cuenta en el cupo de Google."; exit 1
          fi
          echo "Bien."

      - name: Alma no usa el modismo «va» (Juan lo corrigió dos veces)
        run: |
          if grep -nE "(['\"«] *Va[,. ]|Va como )" apps-script/*.js playbooks/*.md; then
            echo "::error::Alma no dice «va» (ni «Va,», ni «Va como»): usa «Listo», «Claro» o «Perfecto». Ver ESTANDARES.md."; exit 1
          fi

      - name: Alma no anuncia lo que va a hacer ni nombra a Claudio al pasarle algo (Juan lo pidió más de una vez)
        run: |
          if grep -niE "se lo (digo|paso|pasé|mando|mandé|envío|voy a (pasar|mandar|reportar)) a claudio|ya se lo (mandé|pasé)|lo consulto con mi sistema|voy a consultar con mi sistema|lo reviso en mi sistema" apps-script/*.js playbooks/*.md | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(/\*|\*|//)' | grep -v '^apps-script/almafuente.js:'; then
            echo "::error::Alma no anuncia lo que va a hacer («se lo paso a Claudio», «lo consulto con mi sistema»): lo hace y confirma una vez, ya hecho («Listo, quedó …»). Ver ESTANDARES.md."; exit 1
          fi
          echo "Bien."

      - name: Fuente única de Alma (playbooks/alma.json y huespedes.json)
        # JSON válido y copiado a apps-script/almafuente.js, ids únicos, sin «va», sin anunciar a Claudio, sin
        # «secretaria», sin otro «esto manda sobre todo», y cada herramienta de la voz con su línea.
        run: node .github/alma-json.js apps-script

      - name: Presupuesto de los prompts, medido sobre el texto armado de cada canal
        run: node .github/presupuesto-prompts.js apps-script

      - name: El PR trae evidencia (aviso)
        run: |
          if ! printf '%s' "$CUERPO" | grep -qiE '^##+ *(evidencia|prueba)'; then
            echo "::warning::El PR no tiene la sección «Evidencia» (antes y después). Ver .github/pull_request_template.md."
          fi

      - name: Plantilla para socios, con dobles de la API de Meta (crear, aprobada, pasada a Marketing)
        run: node .github/socio-plantilla.js apps-script

      - name: La voz del Modo calle dice por qué no hubo audio (dobles de ElevenLabs)
        run: node .github/calle-voz.js apps-script

      - name: Casos por WhatsApp, el texto libre solo es respuesta si cita el aviso o es claramente para el huésped (dobles)
        # 3-nov: «Escríbele a Diana…» salió como respuesta para Alejandra. Segunda vez con casos/borradores (ver #419).
        run: node .github/decision-texto.js apps-script

      - name: Un mensaje del huésped es un caso y un aviso, aunque dos disparos lo procesen a la vez (dobles)
        # 3-nov: el caso de Alejandra (la biblia) llegó dos veces a Juan, con opciones A/B/C distintas: dos pasadas se cruzaron.
        run: node .github/decision-unica.js apps-script

      - name: Respuesta con fuentes, Alma revisa la ficha y las fotos antes de llamar al equipo (dobles)
        # 3 y 4-nov: un huésped preguntó si Ignacio 301 tiene TV en cada habitación; las fotos de limpieza lo mostraban (#446 T11).
        run: node .github/respuesta-fuentes.js apps-script
      - name: Salas Priority Pass, filtro por terminal y caché de 30 días (dobles de la búsqueda y de la hoja)
        run: node .github/salas-pp.js apps-script
      - name: Responder en el hilo, reenvíos de Gmail, iPhone y Outlook, nada sale sin el sí y adjuntos por el modelo (dobles)
        # 4-nov: Juan reenvía a Alma el correo de un socio y le dice qué contestar; la respuesta va al socio, en su hilo.
        run: node .github/correo-hilo.js apps-script
      - name: Tarjeta de la llamada, una sola cosa, sin repetir, solo la app y nunca la familia (dobles)
        # #446 T2: la tarjeta sale de lo que la secretaria ya leyó (sin IA ni Hospitable); el apartamento nunca lleva códigos.
        run: node .github/tarjeta-llamada.js apps-script
      - name: Relevo de contacto, la respuesta que cita «X respondió» va a X y Alma encuentra a quien ya le escribió (dobles)
        # 4-nov: Juan citó «Gustavo Peña respondió…» y Alma preguntó si era para Inés Flores y después pidió su número.
        run: node .github/relevo-contacto.js apps-script
      - name: Consultas (inquiries), Alma las encuentra, muestra el borrador y envía solo con el sí; tarjeta nunca por WhatsApp (dobles)
        # 5-nov: Juan pidió tres veces escribirle a una consulta de Airbnb; Alma no la encontró, lo trató como a la interesada y habló de Likin.
        run: node .github/consulta-inquiry.js apps-script
