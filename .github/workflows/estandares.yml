# Estándares que una máquina puede revisar (ESTANDARES.md, marcados ✅). «Un error que una máquina puede ver, se vuelve
# un check»: cuando algo se corrige dos veces y se puede detectar solo, se agrega aquí.
name: Revisar estándares

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  estandares:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.base_ref }}
      CUERPO: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Si cambió sa-nav.js o alma-client.js, su versión subió en las páginas
        run: |
          git fetch -q origin "$BASE"
          fallo=0
          for js in js/sa-nav.js js/alma-client.js; do
            if git diff --quiet "origin/$BASE"...HEAD -- "$js"; then continue; fi
            nombre=$(basename "$js")
            for pag in $(grep -rl --include=*.html "$nombre?v=" . | grep -v node_modules); do
              antes=$(git show "origin/$BASE:${pag#./}" 2>/dev/null | grep -o "$nombre?v=[^\"']*" | head -1)
              ahora=$(grep -o "$nombre?v=[^\"']*" "$pag" | head -1)
              if [ -n "$antes" ] && [ "$antes" = "$ahora" ]; then echo "::error file=$pag::Cambió $js pero $pag sigue cargando $ahora: sube el ?v= (si no, los teléfonos usan la versión vieja)"; fallo=1; fi
            done
          done
          exit $fallo

      - name: Una sola roca por pantalla, siempre la misma y con su pulso (sa-nav.js la dibuja; nadie pinta otra)
        # 16-nov-2026: Juan vio rocas distintas en Health y al probar el modo anillo, y pulsos que chocaban con las órbitas.
        run: node .github/una-roca.js .

      - name: Snapshot estilo Jarvis del tablero, piezas, cupo de IA y nada privado (dobles)
        # 16-nov-2026: Juan pidió que el tablero sea un snapshot que se entienda de un vistazo, no cuadros con un número.
        run: node .github/snapshot.js apps-script

      - name: Cada sc-for de las páginas lee su lista con list= (support.js no conoce each=)
        # 3-nov: la ventana de «Acciones pendientes» usaba each= y salía vacía (la píldora decía 1, la lista 0).
        run: |
          if grep -rnE --include=*.html '<sc-for( [^>]*)?>' . | grep -v node_modules | grep -v 'list="'; then
            echo "::error::Un <sc-for> sin list=\"{{ … }}\" no pinta nada (js/support.js lee solo list)."; exit 1
          fi
          echo "Bien."

      - name: La hoja de Mi es privada, nadie la lee por gviz ni por un CSV público
        # 14-nov-2026: su id está en estos repos públicos; mientras se leía por gviz tenía que estar abierta a cualquiera.
        run: node .github/hoja-mi-privada.js .

      - name: Ninguna llave en el código
        run: |
          git fetch -q origin "$BASE"
          if git diff "origin/$BASE"...HEAD -U0 | grep -E '^\+' | grep -E 'sk-ant-[a-z0-9]{3,}-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|xox[bap]-[0-9A-Za-z-]{20,}|EAA[A-Za-z0-9]{60,}'; then
            echo "::error::Hay algo que parece una llave en el cambio. Las llaves van en las Propiedades del script o en los secretos de GitHub."; exit 1
          fi
          echo "Sin llaves."

      - name: En el SQL del cerebro, hash va entre acentos graves (palabra reservada de BigQuery)
        run: |
          if grep -nE "(SELECT|WHERE|ARRAY_AGG|GROUP BY|ORDER BY|DELETE).*[^\`.a-zA-Z_]hash[^\`a-zA-Z_]" apps-script/cerebro*.js | grep -v '^[^:]*:[0-9]*: *\(/\*\|\*\)'; then
            echo "::error::Usa \`hash\` entre acentos graves en el SQL del cerebro: HASH es palabra reservada de BigQuery."; exit 1
          fi
          echo "Bien."

      - name: Las llamadas a internet pasan por uf_ (cuentan el cupo de Google)
        run: |
          if grep -nE 'UrlFetchApp\.fetch(All)?\(' apps-script/*.js | grep -v '^apps-script/cupo\.js:'; then
            echo "::error::Usa uf_(url, opciones, canal) o ufAll_(pedidos, canal) de apps-script/cupo.js: así la llamada cuenta en el cupo de Google."; exit 1
          fi
          echo "Bien."

      - name: Alma no usa el modismo «va» (Juan lo corrigió dos veces)
        run: |
          if grep -nE "(['\"«] *Va[,. ]|Va como )" apps-script/*.js playbooks/*.md; then
            echo "::error::Alma no dice «va» (ni «Va,», ni «Va como»): usa «Listo», «Claro» o «Perfecto». Ver ESTANDARES.md."; exit 1
          fi

      - name: Alma no anuncia lo que va a hacer ni nombra a Claudio al pasarle algo; «te paso con Claudio» solo en Hablar con Claudio (Juan lo pidió más de una vez)
        run: |
          if grep -niE "se lo (digo|paso|pasé|mando|mandé|envío|voy a (pasar|mandar|reportar)) a claudio|ya se lo (mandé|pasé)|lo consulto con mi sistema|voy a consultar con mi sistema|lo reviso en mi sistema" apps-script/*.js playbooks/*.md | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(/\*|\*|//)' | grep -v '^apps-script/almafuente.js:'; then
            echo "::error::Alma no anuncia lo que va a hacer («se lo paso a Claudio», «lo consulto con mi sistema»): lo hace y confirma una vez, ya hecho («Listo, quedó …»). Ver ESTANDARES.md."; exit 1
          fi
          # 16-nov (#550): «te paso con Claudio» existe solo en Hablar con Claudio, con el administrador principal: la frase vive
          # una sola vez en apps-script/claudio.js (CLAUDIO_FRASE_) y Alma la dice solo si su ficha trae CLAUDIO_PERMISO_.
          if grep -niE "te (paso|comunico|transfiero) con claudio" apps-script/*.js playbooks/*.md playbooks/*.json | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(/\*|\*|//)' | grep -v '^apps-script/claudio.js:'; then
            echo "::error::«Te paso con Claudio» solo vive en apps-script/claudio.js (Hablar con Claudio, solo el administrador principal). Con huéspedes, socios, equipo y externos Claudio no existe. Ver ESTANDARES.md."; exit 1
          fi
          echo "Bien."

      - name: Fuente única de Alma (playbooks/alma.json y huespedes.json)
        # JSON válido y copiado a apps-script/almafuente.js, ids únicos, sin «va», sin anunciar a Claudio, sin
        # «secretaria», sin otro «esto manda sobre todo», y cada herramienta de la voz con su línea.
        run: node .github/alma-json.js apps-script

      - name: Presupuesto de los prompts, medido sobre el texto armado de cada canal
        run: node .github/presupuesto-prompts.js apps-script

      - name: El prompt de cada canal llega en JSON válido y sin perder ninguna línea (voz, chat, WhatsApp, calle, redactor)
        # 12-nov: Juan decidió que Alma reciba su prompt en JSON por secciones, con el mismo contenido (#498 T2).
        run: node .github/prompts-json.js apps-script

      - name: Protección de las instrucciones de la voz, no cuelga y solo el principal habla del prompt, por la marca del Hub (dobles)
        # 12-nov: la protección integrada «Prompt Injection» de ElevenLabs colgó una llamada de Juan mientras le pedía a Alma
        # mejorar su prompt (#498 T3). Ahora es personalizada, con retry, y quién es el principal lo dice el Hub, no la llamada.
        run: node .github/voz-proteccion.js apps-script

      - name: Acceso cerrado a la voz, nadie abre la conversación con solo el id y el Hub deja enable_auth en true (dobles)
        # 12-nov: el agente aceptaba llamadas con solo su id (público en el repo): cualquiera podía mandar una ficha falsa.
        # Ahora toda llamada desde las apps lleva una URL firmada que el Hub da con la sesión verificada (vozacceso.js).
        run: node .github/voz-acceso.js apps-script

      - name: Camino rápido de la voz, leer va al modelo rápido con solo herramientas de leer y lo demás al de siempre (dobles)
        # 12-nov: Juan decidió usar el modelo más rápido para pedidos de leer en llamadas mientras llega Jev (#498 T4).
        # Escribir va al de siempre; si el rápido no puede, pasa al de siempre; VOZ_RAPIDO = 0 lo apaga.
        # 13-nov: decide el portero Jev (#498 T5), con dobles de su API; si falla o tarda, las reglas de antes.
        run: node .github/voz-rapido.js apps-script

      - name: Huella de las herramientas de voz, solo se guarda si cada herramienta quedó en el agente; si falta alguna, la siguiente vuelta reintenta (dobles)
        # 17-nov-2026: el Hub guardó la huella sin que las 5 del anillo quedaran en ElevenLabs; voz_sync decía «sin_cambios» y hubo que forzarlas con voz_tools.
        run: node .github/voz-huella.js apps-script

      - name: Llaves desde Ajustes, solo el principal con sesión, solo la lista permitida y nunca devuelve el valor (dobles)
        # 13-nov: la pantalla de Propiedades del script ya no deja agregar más (~50); Juan eligió guardarlas desde Ajustes (opción A).
        run: node .github/llaves.js apps-script

      - name: Reiniciar contraseña, solo con la sesión firmada del administrador principal y sin ninguna llave escrita en la página (dobles)
        # 16-nov-2026: usuarios.html llevaba la llave compartida de las apps y no mandaba la sesión: el botón nunca reiniciaba.
        run: node .github/usuarios-reinicio.js login/apps-script

      - name: El PR trae evidencia (aviso)
        run: |
          if ! printf '%s' "$CUERPO" | grep -qiE '^##+ *(evidencia|prueba)'; then
            echo "::warning::El PR no tiene la sección «Evidencia» (antes y después). Ver .github/pull_request_template.md."
          fi

      - name: Plantilla para socios, con dobles de la API de Meta (crear, aprobada, pasada a Marketing)
        run: node .github/socio-plantilla.js apps-script

      - name: La voz del Modo calle dice por qué no hubo audio (dobles de ElevenLabs)
        run: node .github/calle-voz.js apps-script

      - name: Modo calle rápido (sin Epi en cada mensaje, frases de prueba sin IA, camino rápido, plazo antes de la primera vuelta, vozPausa) y Hablar con Claudio desde la calle (dobles)
        # 16-nov: «Estoy probando el modo» tardó 28 s y la app se rinde a los 25 s; «quiero hablar con Claudio» en Modo calle
        # se volvía un pedido de texto en vez de abrir la llamada con Claudio.
        run: node .github/calle-rapida.js apps-script

      - name: Notificaciones humanas con sus datos y sin datos personales, y la voz de Alma lista antes de que la app la pida (dobles)
        # 13-nov: las notificaciones sonaban a sistema («Hay una pregunta sobre…») y a veces salían con la voz del iPhone porque
        # el audio se armaba en la misma petición y la app dejaba de esperar a los 8-12 s (#509 T1 y T2).
        run: node .github/avisos-humanos.js apps-script

      - name: Casos por WhatsApp, el texto libre solo es respuesta si cita el aviso o es claramente para el huésped (dobles)
        # 3-nov: «Escríbele a Diana…» salió como respuesta para Alejandra. Segunda vez con casos/borradores (ver #419).
        run: node .github/decision-texto.js apps-script

      - name: Rutina de cada hora, responde sola solo con una respuesta anterior del equipo y nunca dinero ni de noche (dobles)
        # 15-nov: Juan pidió que cada hora Alma limpie pendientes y promesas sin humano y resuelva sola al menos el 60 % (#545).
        run: node .github/rutina-hora.js apps-script

      - name: Un mensaje del huésped es un caso y un aviso, aunque dos disparos lo procesen a la vez (dobles)
        # 3-nov: el caso de Alejandra (la biblia) llegó dos veces a Juan, con opciones A/B/C distintas: dos pasadas se cruzaron.
        run: node .github/decision-unica.js apps-script

      - name: Respuesta con fuentes, Alma revisa la ficha y las fotos antes de llamar al equipo (dobles)
        # 3 y 4-nov: un huésped preguntó si Ignacio 301 tiene TV en cada habitación; las fotos de limpieza lo mostraban (#446 T11).
        run: node .github/respuesta-fuentes.js apps-script
      - name: Salas Priority Pass, filtro por terminal y caché de 30 días (dobles de la búsqueda y de la hoja)
        run: node .github/salas-pp.js apps-script
      - name: Responder en el hilo, reenvíos de Gmail, iPhone y Outlook, nada sale sin el sí, adjuntos y la búsqueda con y sin tildes (dobles)
        # 4-nov: Juan reenvía a Alma el correo de un socio y le dice qué contestar; la respuesta va al socio, en su hilo.
        # 5-nov: «…para remodelación» (con tilde) no encontró «…remodelacion» y Alma le pidió a Juan reenviar lo que ya estaba.
        # 6-nov: con adjuntos de Drive (los PDF del presupuesto de MONACO para Casa Sol), que el borrador nombra.
        run: node .github/correo-hilo.js apps-script
      - name: Tarjeta de la llamada, una sola cosa, sin repetir, solo la app y nunca la familia (dobles)
        # #446 T2: la tarjeta sale de lo que la secretaria ya leyó (sin IA ni Hospitable); el apartamento nunca lleva códigos.
        run: node .github/tarjeta-llamada.js apps-script
      - name: Relevo de contacto, la respuesta que cita «X respondió» va a X y Alma encuentra a quien ya le escribió (dobles)
        # 4-nov: Juan citó «Gustavo Peña respondió…» y Alma preguntó si era para Inés Flores y después pidió su número.
        run: node .github/relevo-contacto.js apps-script
      - name: Consultas (inquiries), Alma las encuentra, muestra el borrador y envía solo con el sí; tarjeta nunca por WhatsApp (dobles)
        # 5-nov: Juan pidió tres veces escribirle a una consulta de Airbnb; Alma no la encontró, lo trató como a la interesada y habló de Likin.
        run: node .github/consulta-inquiry.js apps-script
      - name: Promesas al huésped, se cierran solas con evidencia o porque ya no aplican, y no se repiten (dobles)
        # 6-nov: 95 de 147 promesas vencieron sin marca; el equipo contesta directo en Hospitable o WhatsApp y nada las cerraba.
        run: node .github/promesas-huesped.js apps-script
      - name: Presupuesto de Grow por apartamento, importa sin duplicar y un PDF por llamada a WhatsApp y con su drive_id (dobles)
        # 6-nov: el equipamiento de MONACO para 6 apartamentos y los PDF para el correo a Casa Sol.
        run: node .github/grow-presupuesto.js apps-script
      - name: Reporte del mes, la ocupación y el neto salen de la hoja de Mi, nunca de un cálculo, y un mes que no está no se estima (dobles)
        # 7-nov: Alma dijo 26 % de ocupación de Rue 301 en octubre (eran 26 noches; la real, 83.9 %).
        run: node .github/reporte-mes.js apps-script
      - name: Enlaces cortos, mismo enlace mismo código, «enlace» pública y todo WhatsApp, correo y Hospitable sale con el corto (dobles)
        # #488 T2: los enlaces largos (los PDF de Drive, el formulario de Grow, el Hub) se veían raros y daban desconfianza.
        run: node .github/enlaces.js apps-script
      - name: Envío a un huésped con el sí de Juan va a la reserva del borrador, error real de Hospitable y el aviso del código sale una vez (dobles)
        # 7-nov: el «Si» de Juan para Oscar (Brunelo 1808) no salió y Alma dijo «no tiene conversación activa»; a Juan le llegó
        # tres veces «El huésped sigue sin su código» por Estrella (Ignacio 1206), después de haberle contestado.
        run: node .github/envio-huesped.js apps-script
      - name: Alma escala sola cuando no puede, no promete sin hacerlo, pide en JSON y une sola solo lo que Juan necesita (dobles)
        # 11-nov: Juan pidió sus contactos de recepción de Hola; Alma dijo «necesito pedírselo a Claudio… ¿Lo pido?» y no pidió
        # nada hasta su «Si» 44 min después (y salió dos veces). 12-nov: Alma une sola solo lo necesario para un pedido de Juan.
        run: node .github/escalar-sola.js apps-script
      - name: Registro a recepción, los números salen a Meta con 502 y una sola vez (dobles)
        # 12-nov: Brunelo dijo que no recibía; en Hola había recepciones escritas sin 502 y el administrador recibía dos veces.
        run: node .github/recepcion-numeros.js apps-script
      - name: Bandeja, la consulta que se vuelve reserva queda con código, propiedad y fechas, y la reparación corre una vez (dobles)
        # 7-nov: la fila de Oscar (Brunelo 1808) no tenía el código y Alma no encontraba su conversación; 95 filas de noviembre
        # igual, todas de consultas que se volvieron reservas. #475 lo esquivó al usarla; esto lo arregla en la fusión.
        run: node .github/bandeja-codigos.js apps-script
      - name: Instrucción a Alma desde una sesión de Claude, solo del dueño, una vez, con error visible, sin datos en el issue y la respuesta siempre llega (dobles)
        # 12-nov: Juan quiso que Claude le pidiera a Alma programar un WhatsApp de prueba a Recepción Brunelo; no había por dónde.
        run: node .github/para-alma.js apps-script
      - name: Códigos de acceso, extensión pide el código nuevo una vez y el código ya enviado se reenvía sin emergencia (dobles)
        # 12-nov: con una extensión el PIN de igloohome no se renueva (Estrella, Ignacio 1206; Luis, Ignacio 904) y salía el
        # código de emergencia aunque el PIN ya estaba en la conversación (9 dígitos en su línea: nadie lo veía).
        run: node .github/codigos-acceso.js apps-script
      - name: Pedidos en órbita, rápido cerca y largo lejos, check que se va, sin porcentajes ni datos sensibles y sin movimiento si se pide (dobles)
        # 13-nov: Juan quiere ver en el inicio lo que Alma sigue trabajando en segundo plano (#509 T3, prototipo «C · Órbita»).
        run: node .github/orbita.js apps-script
      - name: Alma abre la conversación solo con un resultado de un pedido reciente del principal, una vez y sin datos sensibles (dobles)
        # 13-nov: Juan quiere que Alma abra ella misma la conversación para contarle un resultado (#509 T4), sin gastar de más.
        run: node .github/alma-abre.js apps-script
      - name: Ahorro del cupo de Google, conteo por función, intervalos respetados y lo del webhook en la misma vuelta (dobles)
        # 14-nov: el Hub gastaba 7 000–12 000 llamadas al día y «Huéspedes» (lo automático de procesarCola) era el 65–70 %,
        # casi plano de madrugada. Ahora cada llamada dice qué función la hizo y lo que se repetía sin necesidad se espacia.
        run: node .github/cupo-ahorro.js apps-script
      - name: WhatsApp a socios, el número sale de Mi, fuera de 24 h siempre plantilla, «listo» solo con el estado de Meta y si escriben se les contesta (dobles)
        # 13-nov: Juan pidió escribirle a dos socios; Alma no encontró sus números (le preguntó por el apartamento vecino),
        # dijo que ya estaba sin confirmación (no salió nada) y un socio que escribe a veces se queda sin respuesta.
        run: node .github/socios-whatsapp.js apps-script
      - name: Ficha del socio, guarda lo personal permitido, nunca salud, religión, política ni banco, retoma una vez y solo con socios (dobles)
        # 14-nov: Juan quiere que Alma recuerde lo que cada socio le cuenta (la boda de su hija) y se lo pregunte una vez (#522 T1 y T2).
        run: node .github/ficha-socio.js apps-script
      - name: Temas, cada mensaje con el administrador va a su tema, la etiqueta solo con más de uno, cierre solo por resultado y el aviso de GitHub (dobles)
        # 13-nov: el pedido de Narama 633 quedó enterrado bajo 31 mensajes de otros temas y los números que Juan mandó por
        # WhatsApp, sin citar, se trataron como de otro tema (#524, #526).
        run: node .github/temas.js apps-script
      - name: Temas sin preguntas rotas, nombres cortos y legibles, con duda Alma elige y nada cae en el tema de un envío que ya salió (dobles)
        # 16-nov: Alma preguntó «¿Esto es para Juan pregunta cómo estamos con o para Estoy probando el modo?» y «pásame con
        # Claudio» cayó en el tema de una huésped cuyo «sí» se había terminado en segundo plano: el mensaje salió dos veces (#583 T2).
        run: node .github/temas-elegir.js apps-script
      - name: Tocar un anillo o su notificación manda su id, va a su tema con el estado ya cargado y una pregunta de estado no va a Claude (dobles)
        # 16-nov: el toque del anillo «Cupos Google» mandaba solo el texto y el tema se adivinaba; tres nombres para lo mismo (#583 T1).
        run: node .github/orbita-tema.js apps-script
      - name: Hablar con Claudio, el agente se crea una vez, la firma y la herramienta solo con el principal, no une sin «une» y Claudio no existe con otras audiencias (dobles)
        # 16-nov: Juan quiere hablar por voz con el equipo de desarrollo desde la app de Alma (#550): otro agente, otra voz y el
        # halo naranja; Claudio sigue sin existir para huéspedes, socios, equipo y externos.
        run: node .github/hablar-claudio.js apps-script
      - name: Panel de Claudio, A al entrar y con «qué están haciendo», B al hablar de un trabajo, sin porcentajes, la pregunta por el camino de Pendientes y solo el principal (dobles)
        # 16-nov: Juan quiere ver en pantalla lo que hace desarrollo mientras habla con Claudio (#550, prototipos A y B, como el
        # panel «Agent Huddle»): sin pasos reales de la sesión de Claude, la barra es la etapa, nunca un porcentaje.
        run: node .github/panel-claudio.js apps-script
      - name: Alma no repite la misma muletilla ni la misma frase seguidas («Listo, entregado») y el resto del texto queda igual (dobles)
        # 14-nov: Juan pidió que Alma varíe el fraseo y no caiga en bucles como «Listo, entregado» (pedido pc1794698090317).
        run: node .github/variar-frases.js apps-script
      - name: Notificaciones por tipo, una clasificación, ajustes por usuario con sesión, lo que la app recibe, el Hub web, «Probar con Siri», los pasos del anillo y la conversación continua en Modo calle y conferencia, sin despedidas y sin colgar (dobles)
        # 16-nov: Juan quiere ajustes como los de WhatsApp, por tipo, y Siri sin pisar la voz de Alma (#551, diseño B). El mismo
        # día: probar si Siri anuncia, saber por qué el anillo deja de responder y que Alma no se despida en Modo calle ni conferencia.
        run: node .github/notif-ajustes.js apps-script
      - name: Notificación push de la app, solo con la app dormida y su push listo, al external_id con el id del aviso, respeta el tipo, sin duplicados ni WhatsApp repetido y nada falla sin llave (dobles)
        # 16-nov: Juan dijo sí a notificaciones push reales para la app de Alma (Ticket #28): con la app dormida no llegaba
        # nada (solo avisos locales cada 45 s) y Siri no podía anunciarlas con el teléfono bloqueado.
        run: node .github/push-app.js apps-script
      - name: Pendientes limpios, se cierran solos con su motivo cuando su origen se resolvió, lo informativo vence, la pregunta se repite una vez y la corrida única respalda (dobles)
        # 16-nov: en Pendientes 85 de 163 tarjetas seguían abiertas: temas ya cerrados, cambios ya unidos, el mismo aviso de
        # entrega 4 veces y avisos que nunca cambiaban de estado; las preguntas esperaban sin que nadie volviera a preguntar (#567 T2).
        run: node .github/pendientes-limpios.js apps-script

      - name: Plática directa, el saludo no ofrece pendientes y solo lo urgente se dice una vez (dobles)
        # 16-nov (#607): 13 de 44 llamadas empezaban ofreciendo pendientes que casi nunca eran urgentes.
        run: node .github/pendientes-voz.js apps-script

      - name: Tablero de datos, lo que Alma responde con números y listas se ve en la llamada sin códigos ni teléfonos (dobles)
