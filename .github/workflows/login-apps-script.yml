# Revisa el Apps Script del LOGIN (hoja «Control de usuarios») cuando un cambio aprobado llega a main.
# La web (GitHub Pages) se publica sola.
#
# Desde el corte a alma@ (18-nov-2026, docs/specs/traslado-workspace.md) el login ya no se publica con clasp ni con la
# cuenta vieja: lo publica «Traslado a Workspace» (traslado.yml) al unir, porque login tiene "sincronizar": true en
# traslado/proyectos.json. El login viejo queda vivo 7 días de respaldo, sin cambios.

name: Publicar Apps Script del login

on:
  push:
    branches: [main]
    paths:
      - "login/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: login-apps-script
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Revisar el código
        run: for f in login/apps-script/*.js; do cp "$f" /tmp/x.js; node --check /tmp/x.js; done

      - name: Dónde se publica
        run: echo "El login se publica en alma@ con «Traslado a Workspace» (traslado.yml), no con clasp." >> "$GITHUB_STEP_SUMMARY"
