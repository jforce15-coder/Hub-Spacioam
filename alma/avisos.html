<html lang="es">
<head>

<!-- Ajustes → Notificaciones por tipo (#551, diseño B, como WhatsApp): la lista de los 5 tipos con un resumen de cómo llega
     cada uno y, al tocar uno, su pantalla: los tres teléfonos (bloqueada, centro, banner), sonido, número en el ícono,
     anunciar con Siri, vista previa y agrupar. Los ajustes se guardan por usuario en el Hub (apps-script/notifajustes.js,
     acciones notifAjustes y notifAjustesGuardar); la app de Alma los recibe en vozAvisos y el Hub web los respeta (sin Siri).
     Mismos componentes que Ajustes en inicio.html: grupo, fila, interruptor, selector, títulos y notas.
     «Probar con Siri» (Juan, 16-nov-2026): en la app, ella programa una notificación a los 15 s armada como mensaje de Alma,
     con Siri (NotifArmar.swift, accion notif · probarSiri → AlmaNotif.evento); en el Hub web, la pide al Hub (notifPrueba,
     solo el principal) y llega a la app con su próxima vuelta. -->
<style>
  :root { color-scheme: light; --tinta: #3E3F3F; --suave: #8A8580; --tenue: #A39B93; --linea: rgba(62,63,63,.12); --crema: #FAF8F6; --durazno: #E9826A; --durazno-t: #B5624E; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--crema); color: var(--tinta); font: 15px/1.45 Montserrat, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 460px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .barra { display: flex; align-items: center; gap: 12px; }
  .barra .t { flex: 1; min-width: 0; font: 600 10px Montserrat, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .redondo { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: #fff; display: grid; place-items: center; color: var(--tinta); text-decoration: none; box-shadow: 0 10px 22px -12px rgba(70,50,40,.45); cursor: pointer; }
  .redondo svg { width: 20px; height: 20px; }
  h1 { margin: 26px 4px 6px; font: 400 clamp(30px, 9vw, 38px)/1.05 Valky, Georgia, serif; }
  .bajada { margin: 0 4px 18px; font-size: 13px; line-height: 1.5; color: var(--suave); }
  .estado { min-height: 18px; margin: -10px 4px 10px; font-size: 12px; color: var(--suave); }
  .estado.mal { color: #B4452A; }
  /* ── Los componentes de Ajustes (alma/inicio.html) ── */
  .grupo { background: rgba(255,255,255,.75); border-radius: 18px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 18px 40px -30px rgba(40,30,25,.45); }
  .fila { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 10px 16px; box-sizing: border-box; font-size: 15px; }
  .fila + .fila { border-top: .5px solid var(--linea); }
  .fila[hidden], .grupo[hidden] { display: none; }
  .fila .et { flex: 1; min-width: 0; }
  .fila .et.n { white-space: nowrap; }
  .fila.boton { width: 100%; border: 0; background: transparent; font: 600 15px Montserrat, system-ui, sans-serif; color: var(--tinta); justify-content: center; cursor: pointer; }
  .fila.boton:disabled { color: var(--tenue); cursor: default; }
  .fila.boton:focus-visible { outline: 2px solid var(--durazno); outline-offset: -2px; border-radius: 18px; }
  .cuenta { font-variant-numeric: tabular-nums; }
  .tit-g { margin: 18px 4px 8px; font: 600 10.5px Montserrat, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--suave); }
  .nota-g { font-size: 12px; line-height: 1.45; color: var(--suave); margin: 0; padding: 0 16px 12px; }
  .nota-g[hidden] { display: none; }
  .interruptor { position: relative; width: 51px; height: 31px; flex: none; }
  .interruptor input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .interruptor span { position: absolute; inset: 0; border-radius: 16px; background: rgba(120,120,128,.24); transition: background .25s; pointer-events: none; }
  .interruptor span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15); transition: transform .42s cubic-bezier(.3,1.3,.55,1), width .18s ease; }
  .interruptor input:checked + span { background: var(--durazno); }
  .interruptor input:checked + span::after { transform: translateX(20px); }
  .interruptor input:active + span::after { width: 33px; }
  .interruptor input:checked:active + span::after { transform: translateX(14px); }
  .interruptor input:focus-visible + span { outline: 2px solid var(--durazno); outline-offset: 2px; }
  .fila .sel { position: relative; flex: 0 1 auto; min-width: 0; max-width: 62%; }
  .fila .sel select { -webkit-appearance: none; appearance: none; border: 0; background: transparent; font: 500 14px Montserrat, system-ui, sans-serif; color: var(--suave);
    padding: 8px 20px 8px 4px; max-width: 100%; text-align: right; text-overflow: ellipsis; cursor: pointer; }
  .fila .sel::after { content: ""; position: absolute; right: 4px; top: 50%; width: 7px; height: 7px; margin-top: -6px; border: solid var(--tenue); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); pointer-events: none; }
  .fila .sel select:focus-visible { outline: 2px solid var(--durazno); outline-offset: 2px; border-radius: 8px; }
  /* ── La lista de tipos: nombre, resumen corto y la flecha ── */
  .tipo { width: 100%; border: 0; background: transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .tipo .et b { display: block; font-weight: 600; font-size: 15px; }
  .tipo .et small { display: block; margin-top: 2px; font-size: 12.5px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tipo .et small.apagado { color: var(--durazno-t); }
  .tipo .flecha { color: var(--tenue); font-size: 20px; line-height: 1; }
  .tipo:focus-visible { outline: 2px solid var(--durazno); outline-offset: -2px; border-radius: 18px; }
  .punto { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--durazno); }
  .punto.urgentes { background: #D9583A; } .punto.huespedes { background: #E9826A; } .punto.equipo { background: #8FA5C8; } .punto.socios { background: #8FB38C; } .punto.pendientes { background: #A98C93; }
  /* ── Los tres teléfonos (como WhatsApp): dónde se ve, con su check ── */
  .tels { display: flex; justify-content: space-around; gap: 6px; padding: 16px 8px 12px; }
  .tel { flex: 1 1 0; min-width: 0; max-width: 110px; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: transparent; padding: 4px 0; font: 500 12.5px Montserrat, system-ui, sans-serif; color: var(--tinta); cursor: pointer; }
  .tel .cuerpo { position: relative; width: 46px; height: 82px; border: 2.5px solid var(--durazno); border-radius: 11px; transition: border-color .2s; }
  .tel .cuerpo i { position: absolute; left: 5px; right: 5px; height: 8px; border-radius: 3px; background: var(--durazno); transition: background .2s; }
  .tel .cuerpo i.t { opacity: .45; }
  .tel .ck { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--durazno); color: #fff; transition: background .2s, box-shadow .2s; }
  .tel .ck svg { width: 13px; height: 13px; }
  .tel[aria-pressed="false"] .cuerpo { border-color: #D8D4CE; }
  .tel[aria-pressed="false"] .cuerpo i { background: #D8D4CE; }
  .tel[aria-pressed="false"] .ck { background: #fff; box-shadow: inset 0 0 0 1.5px #D8D4CE; color: transparent; }
  .tel:active .cuerpo { transform: scale(.96); }
  .tel:focus-visible { outline: 2px solid var(--durazno); outline-offset: 2px; border-radius: 14px; }
  @media (prefers-reduced-motion: reduce) { .interruptor span::after, .tel .cuerpo, .tel .ck { transition: none; } }
  /* esqueleto mientras llegan los ajustes */
  .esq { display: grid; gap: 12px; margin-top: 26px; }
  .esq i { display: block; height: 14px; border-radius: 8px; background: linear-gradient(90deg, #EFEBE6 0%, #F7F4F1 50%, #EFEBE6 100%); background-size: 200% 100%; animation: esq 1.6s ease-in-out infinite; }
  .esq .e1 { width: 60%; height: 34px; } .esq .e2 { width: 100%; height: 300px; border-radius: 18px; }
  @keyframes esq { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .esq i { animation: none; } }
  @media (max-width: 350px) { .fila { padding: 10px 12px; } .tel { font-size: 11.5px; } .fila .sel { max-width: 56%; } }
</style>
</head>
<body>
<main>
  <div class="barra">
    <a class="redondo" id="b-volver" href="inicio.html" aria-label="Volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="t" id="t-barra">Ajustes · Notificaciones</div>
  </div>
  <div id="cuerpo"><div class="esq" aria-label="Cargando tus notificaciones"><i class="e1"></i><i class="e2"></i></div></div>
</main>
<script>
(function () {
  "use strict";
  var URL = "https://script.google.com/macros/s/AKfycbycTV0MsPWym02-ZcbpBBtwg9-WLw8dK9SAEDBslPd_9mgmizPQJS4-B_Q4uEkTWFqQ/exec";
  var NATIVA = !!(window.webkit && webkit.messageHandlers && webkit.messageHandlers.alma);
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var VISTAS = [["siempre", "Siempre"], ["desbloqueado", "Solo desbloqueado"], ["nunca", "Nunca"]];
  var AGRUPAR = [["auto", "Automático"], ["tipo", "Por tipo"], ["no", "No"]];
  var TIPOS = [], abierto = "", guardarT = {}, empujado = false;
  /* En el Hub web no hay Siri (el iPhone no anuncia notificaciones de páginas): la fila no se pinta. */
  if (!NATIVA) $("b-volver").href = "../";

  function pedir(accion, extra) {
    if (window.ALMA_NOTIF) return window.ALMA_NOTIF(accion, extra || {});   // para probar la página con datos de ejemplo
    var ses = window.SASesion && SASesion.leer && SASesion.leer();
    if (!ses) return Promise.resolve({ ok: false, error: "Entra primero con tu usuario y vuelve a abrir esta página." });
    var b = Object.assign({ hub: 1, action: accion, session: ses }, extra || {});
    return fetch(URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, cache: "no-store", body: JSON.stringify(b) })
      .then(function (r) { return r.json(); }).catch(function () { return { ok: false, error: "Sin conexión con el Hub. Intenta de nuevo." }; });
  }

  /* El resumen corto de cada tipo en la lista: dónde llega, el sonido y Siri (o «Apagadas»). */
  function resumen(a) {
    if (!a.bloqueada && !a.centro && !a.banner) return "Apagadas";
    var donde = a.bloqueada && a.centro && a.banner ? "En todos lados" : [a.bloqueada && "bloqueada", a.centro && "centro", a.banner && "banner"].filter(Boolean).join(" y ");
    donde = donde.charAt(0).toUpperCase() + donde.slice(1);
    var r = [donde, a.sonido ? "sonido" : "sin sonido"];
    if (a.siri && NATIVA) r.push("Siri");
    if (a.vista === "nunca") r.push("sin vista previa"); else if (a.vista === "desbloqueado") r.push("solo desbloqueado");
    return r.join(" · ");
  }
  function tipoDe(k) { return TIPOS.filter(function (t) { return t.k === k; })[0]; }

  function pintarLista() {
    abierto = ""; $("t-barra").textContent = "Ajustes · Notificaciones";
    $("b-volver").onclick = null;
    var C = $("cuerpo"); C.innerHTML = "";
    C.appendChild(el("h1", "", "Notificaciones"));
    C.appendChild(el("p", "bajada", "Elige cómo te llega cada tipo, como en WhatsApp."));
    var est = el("p", "estado"); est.id = "estado"; C.appendChild(est);
    var g = el("div", "grupo");
    TIPOS.forEach(function (t) {
      var b = el("button", "fila tipo"); b.type = "button"; b.setAttribute("data-k", t.k);
      b.appendChild(el("span", "punto " + t.k));
      var et = el("span", "et"); et.appendChild(el("b", "", t.nombre));
      var s = resumen(t.ajuste), sm = el("small", s === "Apagadas" ? "apagado" : "", s); et.appendChild(sm); b.appendChild(et);
      var fl = el("span", "flecha", "›"); fl.setAttribute("aria-hidden", "true"); b.appendChild(fl);
      b.setAttribute("aria-label", t.nombre + ": " + s);
      b.onclick = function () { abrir(t.k); };
      g.appendChild(b);
    });
    C.appendChild(g);
    C.appendChild(el("p", "nota-g", NATIVA
      ? "Siri anuncia con su voz solo con la app cerrada o el teléfono bloqueado, fuera de conferencia y del Modo calle. Si Alma está activa, te lo dice ella."
      : "En el Hub web cuenta si llega y la vista previa («solo desbloqueado» se ve como «nunca»). Sonido, número, Siri y agrupar son de la app de Alma."));
    pintarPrueba(C);
  }

  /* «Probar con Siri»: en la app, una notificación a los 15 s como mensaje de Alma (con Siri aunque el tipo no lo tenga);
     en el Hub web, el Hub la deja para la app. Abajo, qué hacer mientras tanto y la cuenta atrás. */
  var pruebaT = null;
  function pintarPrueba(C) {
    C.appendChild(el("p", "tit-g", "Prueba"));
    var g = el("div", "grupo"), b = el("button", "fila boton", "Probar con Siri"); b.type = "button"; b.id = "b-siri";
    b.onclick = probarSiri; g.appendChild(b);
    var n = el("p", "nota-g", NATIVA ? "Bloquea el teléfono, ponte los AirPods y espera 15 segundos." : "Te llega a la app de Alma en el iPhone en menos de un minuto (con la app abierta o en segundo plano). Bloquea el teléfono y ponte los AirPods.");
    n.id = "n-siri"; g.appendChild(n);
    C.appendChild(g);
    C.appendChild(el("p", "nota-g", "Si Siri no la lee: Ajustes del iPhone → Notificaciones → Anunciar notificaciones, y enciende Alma."));
  }
  function notaPrueba(txt, mal) { var n = $("n-siri"); if (!n) return; n.textContent = txt; n.style.color = mal ? "#B4452A" : ""; }
  function probarSiri() {
    var b = $("b-siri"); if (b) b.disabled = true;
    clearInterval(pruebaT);
    if (NATIVA) { notaPrueba("Preparando la prueba…"); try { webkit.messageHandlers.alma.postMessage({ accion: "notif", que: "probarSiri" }); } catch (e) { notaPrueba("No se pudo hablar con la app.", true); if (b) b.disabled = false; } return; }
    notaPrueba("Pidiéndola…");
    pedir("notifPrueba").then(function (r) {
      if (b) b.disabled = false;
      if (r && r.ok && r.push) notaPrueba("Listo. Salió por push: te llega en segundos aunque la app de Alma esté cerrada. Bloquea el teléfono y ponte los AirPods.");
      else if (r && r.ok) notaPrueba("Listo. Te llega a la app de Alma en menos de un minuto: bloquea el teléfono y ponte los AirPods.");
      else notaPrueba("No se pudo: " + ((r && r.error) || "sin respuesta") + ".", true);
    });
  }
  /* La app contesta: { tipo: "prueba", ok, en, error }. Cuenta atrás hasta que llegue. */
  window.AlmaNotif = { evento: function (e) {
    if (!e || e.tipo !== "prueba") return;
    var b = $("b-siri");
    if (!e.ok) { if (b) b.disabled = false; notaPrueba(e.error || "No se pudo programar la prueba.", true); return; }
    var falta = Number(e.en) || 15;
    var pinta = function () {
      var n = $("n-siri"); if (!n) { clearInterval(pruebaT); return; }
      n.style.color = ""; n.innerHTML = "";
      n.appendChild(document.createTextNode("Bloquea el teléfono, ponte los AirPods y espera " ));
      n.appendChild(el("b", "cuenta", falta + " s")); n.appendChild(document.createTextNode("."));
    };
    pinta();
    pruebaT = setInterval(function () {
      falta -= 1;
      if (falta > 0) return pinta();
      clearInterval(pruebaT); if ($("b-siri")) $("b-siri").disabled = false;
      notaPrueba("Ya llegó. Si Siri no la leyó, revisa «Anunciar notificaciones» en Ajustes del iPhone.");
    }, 1000);
  } };

  function interruptor(id, txt, on, cambia) {
    var f = el("div", "fila"), et = el("span", "et", txt); et.id = "et-" + id; f.appendChild(et);
    var l = el("label", "interruptor"), i = el("input"); i.type = "checkbox"; i.id = "i-" + id; i.checked = !!on; i.setAttribute("aria-labelledby", "et-" + id);
    i.onchange = function () { cambia(i.checked); }; l.appendChild(i); l.appendChild(el("span")); f.appendChild(l);
    return f;
  }
  function selector(id, txt, opciones, valor, cambia) {
    var f = el("div", "fila"), et = el("span", "et n", txt); et.id = "et-" + id; f.appendChild(et);
    var s = el("span", "sel"), sel = el("select"); sel.id = "s-" + id; sel.setAttribute("aria-labelledby", "et-" + id);
    opciones.forEach(function (o) { var op = el("option", "", o[1]); op.value = o[0]; sel.appendChild(op); });
    sel.value = valor; sel.onchange = function () { cambia(sel.value); }; s.appendChild(sel); f.appendChild(s);
    return f;
  }
  /* Un teléfono: dónde se ve la notificación (las barritas dicen dónde) y su check. */
  function telefono(id, txt, barras, on, cambia) {
    var b = el("button", "tel"); b.type = "button"; b.id = "t-" + id; b.setAttribute("aria-pressed", on ? "true" : "false"); b.setAttribute("aria-label", txt);
    var c = el("span", "cuerpo"); barras.forEach(function (x) { var i = el("i", x[1] ? "t" : ""); i.style[x[0] < 0 ? "bottom" : "top"] = Math.abs(x[0]) + "px"; c.appendChild(i); });
    b.appendChild(c); b.appendChild(el("span", "", txt));
    var ck = el("span", "ck"); ck.innerHTML = CHECK; b.appendChild(ck);
    b.onclick = function () { var v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", v ? "true" : "false"); cambia(v); };
    return b;
  }

  function abrir(k) {
    var t = tipoDe(k); if (!t) return pintarLista();
    abierto = k; var a = t.ajuste;
    $("t-barra").textContent = "Notificaciones · " + t.nombre;
    $("b-volver").onclick = function (ev) { ev.preventDefault(); if (empujado) history.back(); else { history.replaceState(null, "", location.pathname + location.search); pintarLista(); } };
    if (location.hash !== "#" + k) { history.pushState({ k: k }, "", "#" + k); empujado = true; }
    var C = $("cuerpo"); C.innerHTML = ""; window.scrollTo(0, 0);
    C.appendChild(el("h1", "", t.nombre));
    C.appendChild(el("p", "bajada", t.que));
    var est = el("p", "estado"); est.id = "estado"; C.appendChild(est);
    var cambia = function (c) { return function (v) { a[c] = v; apagado(); guardar(k); }; };
    var g = el("div", "grupo"), tels = el("div", "tels");
    tels.appendChild(telefono("bloqueada", "Bloqueada", [[-6]], a.bloqueada, cambia("bloqueada")));
    tels.appendChild(telefono("centro", "Centro", [[16, 1], [28], [40, 1]], a.centro, cambia("centro")));
    tels.appendChild(telefono("banner", "Banner", [[6]], a.banner, cambia("banner")));
    g.appendChild(tels);
    var nApagado = el("p", "nota-g", "Con los tres apagados, este tipo no te llega."); nApagado.id = "n-apagado"; g.appendChild(nApagado);
    g.appendChild(interruptor("sonido", "Sonido", a.sonido, cambia("sonido")));
    g.appendChild(interruptor("numero", "Número en el ícono", a.numero, cambia("numero")));
    if (NATIVA) g.appendChild(interruptor("siri", "Anunciar con Siri", a.siri, cambia("siri")));
    C.appendChild(g);
    if (NATIVA) C.appendChild(el("p", "nota-g", "Siri lo anuncia con su voz, con audífonos o CarPlay, solo cuando la app está cerrada o el teléfono bloqueado y fuera de conferencia y del Modo calle. Si Alma está activa, habla Alma: nunca se oye dos veces."));
    var g2 = el("div", "grupo");
    g2.appendChild(selector("vista", "Vista previa", VISTAS, a.vista, cambia("vista")));
    g2.appendChild(selector("agrupar", "Agrupar", AGRUPAR, a.agrupar, cambia("agrupar")));
    C.appendChild(g2);
    C.appendChild(el("p", "nota-g", "Sin vista previa llega «Alma te dejó un mensaje». Agrupar por tipo junta en el centro las de este tipo; «No» las deja separadas."));
    apagado();
  }
  function apagado() { var t = tipoDe(abierto), n = $("n-apagado"); if (t && n) n.hidden = !!(t.ajuste.bloqueada || t.ajuste.centro || t.ajuste.banner); }
  function estado(txt, mal) { var e = $("estado"); if (!e) return; e.textContent = txt || ""; e.className = "estado" + (mal ? " mal" : ""); }
  /* Cada cambio se guarda solo (un momento después del último toque). */
  function guardar(k) {
    clearTimeout(guardarT[k]); estado("Guardando…");
    guardarT[k] = setTimeout(function () {
      var t = tipoDe(k); if (!t) return;
      pedir("notifAjustesGuardar", { tipo: k, ajuste: t.ajuste }).then(function (r) {
        if (abierto !== k) return;
