<!doctype html>
<html lang="es">
<head>
<script src="https://hub.spacioam.com/js/sa-sesion.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F6">
<title>Bandeja · Alma</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<link rel="stylesheet" href="../ds/tokens/fonts.css">
<link rel="stylesheet" href="../ds/esqueleto.css">
<!-- Bandeja unificada (#888; apps-script/bandejaunica.js y redesmeta.js): una persona por fila, todas las redes.
     Juan eligió (19-nov-2026): en iPad y computadora el prototipo A (carpetas y canales · personas · hilo mezclado ·
     ficha de la persona) y en el iPhone el C (Alma decide el orden: Te toca decidir · Alma lo lleva · Esperando a otros ·
     Listo hoy, una tarjeta a la vez con A · B · C). -->
<style>
  :root { color-scheme: light; --tinta: #3E3F3F; --tenue: #8A8580; --tenue2: #A39B93; --linea: #EEEAE6; --fondo: #FAF8F6; --arena: #F3EFEA;
    --durazno: #E9826A; --durazno-t: #B5624E; --rojo: #D9583A; --halo: linear-gradient(100deg,#E64E37 0%,#EE7552 45%,#F59D68 100%); --nota: #FBF3D9; --nota-b: #E8C468;
    --ease: cubic-bezier(.2,.7,.2,1); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: 500 13.5px/1.45 Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  button { font: inherit; color: inherit; }
  .serif { font-family: Valky, "Cormorant Garamond", Georgia, serif; font-weight: 400; }
  [hidden] { display: none !important; }
  /* piezas comunes */
  .cn { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 700; flex: none; line-height: 1; box-shadow: 0 0 0 2px #fff; }
  .av { position: relative; display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; background-size: cover; background-position: center; }
  .av > i { position: absolute; right: -3px; bottom: -3px; font-style: normal; display: flex; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #F1EDE9; color: var(--tinta); white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--durazno); color: #fff; font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; }
  .btn { white-space: nowrap; border: 0; border-radius: 999px; padding: 0 16px; min-height: 40px; font: 600 12.5px Montserrat, sans-serif; background: #1F1F1F; color: #fff; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn.claro { background: #F1EDE9; color: var(--tinta); }
  .btn:disabled { opacity: .5; cursor: default; }
  .lugar-alma { width: 50px; height: 50px; flex: none; display: grid; place-items: center; }   /* la piedra la dibuja SANav.roca (una sola roca) */
  .gira { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #E8DCD4; border-top-color: var(--durazno); display: inline-block; animation: gira 0.9s linear infinite; flex: none; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .msg-flot { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #3E3F3F; color: #FAF8F6; padding: 10px 16px; border-radius: 999px;
    font: 500 13px Montserrat, sans-serif; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: calc(100% - 32px); z-index: 50; }
  .msg-flot.on { opacity: 1; }
  .vacio { padding: 28px 20px; text-align: center; color: var(--tenue2); }
  .borrador { border-radius: 18px; padding: 12px 14px; background: linear-gradient(#fff,#fff) padding-box, var(--halo) border-box; border: 1.5px solid transparent; }
  .borrador .k { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--rojo); font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .ops { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .op { display: flex; align-items: center; gap: 10px; border-radius: 16px; background: #F6F3F0; padding: 11px 14px; font-weight: 600; text-align: left; border: 1.5px solid transparent; cursor: pointer; min-height: 48px; width: 100%; }
  .op > i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: #1F1F1F; color: #fff; display: grid; place-items: center; font-size: 12px; flex: none; }
  .op.rec { background: linear-gradient(#fff,#fff) padding-box, var(--halo) border-box; }
  .op.on { background: linear-gradient(#FFF6F2,#FFF6F2) padding-box, var(--halo) border-box; }
  .op .vista { font-weight: 500; color: #6F6867; font-size: 12px; display: block; margin-top: 2px; }
  .op small { margin-left: auto; color: var(--rojo); font-size: 11px; flex: none; }
  .sale { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: #1F1F1F; color: #fff; font-size: 12.5px; }
  .sale .btn { margin-left: auto; background: #fff; color: #1F1F1F; min-height: 34px; }
  textarea.ed { width: 100%; min-height: 84px; resize: vertical; border: 1px solid #E5DFD8; border-radius: 14px; padding: 10px 12px; font: 500 13.5px/1.5 Montserrat, sans-serif; background: #FFFDFB; color: var(--tinta); margin-top: 8px; }

  /* ═══ A · iPad y computadora ═══ */
  .app { display: grid; grid-template-columns: 210px minmax(300px, 360px) 1fr 290px; height: 100vh; height: 100dvh; }
  .app > * { min-height: 0; }
  .rail { background: #F3F0EC; border-right: 1px solid var(--linea); padding: max(18px, env(safe-area-inset-top)) 12px 18px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .rail .tit { display: flex; align-items: center; gap: 10px; margin: 0 6px 14px; }
  .rail h1 { font-size: 30px; margin: 0; line-height: 1; }
  .rail .volver { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: #fff; text-decoration: none; color: var(--tinta); box-shadow: 0 6px 14px -10px rgba(70,50,40,.5); }
  .rail .sec { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); font-weight: 700; margin: 14px 8px 6px; }
  .rail button { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 10px; border: 0; background: transparent; text-align: left; font-weight: 500; cursor: pointer; min-height: 38px; width: 100%; }
  .rail button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06); font-weight: 600; }
  .rail button .n { margin-left: auto; color: var(--tenue); font-size: 11.5px; }
  .rail button .ico { width: 20px; text-align: center; flex: none; }
  .rail .apagado { margin-left: auto; font-size: 10px; color: var(--tenue2); }
  .lista { border-right: 1px solid var(--linea); background: #fff; display: flex; flex-direction: column; min-width: 0; }
  .lista .top { padding: max(16px, env(safe-area-inset-top)) 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  .buscar { display: flex; align-items: center; gap: 8px; background: #F3F0EC; border-radius: 12px; padding: 0 12px; min-height: 40px; }
  .buscar input { flex: 1; min-width: 0; min-height: 40px; align-self: stretch; border: 0; background: transparent; font: 500 13.5px Montserrat, sans-serif; color: var(--tinta); outline: none; }
  .seg { display: flex; background: #F3F0EC; border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 7px 0; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--tenue); cursor: pointer; min-height: 34px; }
  .seg button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .chips { display: none; gap: 6px; flex-wrap: wrap; }   /* en varias líneas: en el iPad vertical no cabían y la conversación tapaba Proveedores, Prospectos y Otros (#901) */
  .chips button { border: 0; flex: none; min-height: 32px; }
  .chips button.on { background: #1F1F1F; color: #fff; }
  .filas { flex: 1; overflow-y: auto; }
  .fila { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #F5F2EF; align-items: flex-start; cursor: pointer; border-left: 3px solid transparent; }
  .fila:hover { background: #FCFAF8; }
  .fila.on { background: #FBF3EF; border-left-color: var(--durazno); }
  .fila .m { flex: 1; min-width: 0; }
  .fila .l1 { display: flex; align-items: center; gap: 6px; }
  .fila .l1 b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fila .l1 small { margin-left: auto; color: var(--tenue); font-size: 11px; flex: none; }
  .fila .l2 { color: #6F6867; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .fila .l3 { display: flex; gap: 5px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  .fila .l3 .badge { margin-left: auto; }
  .conv { display: flex; flex-direction: column; background: var(--fondo); min-width: 0; }
  .conv .cab { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 20px 14px; background: #fff; border-bottom: 1px solid var(--linea); }
  .conv .cab .q { min-width: 0; }
  .conv .cab .q b { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .cab .q span { font-size: 11.5px; color: var(--tenue); }
  .conv .cab .acc { margin-left: auto; display: flex; gap: 6px; flex: none; }
  .atras { display: none; border: 0; background: transparent; font-size: 30px; color: var(--rojo); padding: 0 6px 0 0; cursor: pointer; min-width: 36px; min-height: 44px; }
  .hilo { flex: 1; padding: 20px 28px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .msg { max-width: 72%; padding: 10px 13px; border-radius: 16px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); white-space: pre-wrap; word-wrap: break-word; }
  .msg.nos { align-self: flex-end; background: #1F1F1F; color: #fff; }
  .msg.auto { align-self: flex-end; background: #EFEBE6; color: #5A5856; }
  .msg.nota { align-self: center; max-width: 86%; background: var(--nota); border: 1px dashed var(--nota-b); box-shadow: none; }
  .msg.llamada { align-self: center; max-width: 86%; background: #fff; border: 1px solid #F1D9CF; }
  .msg .meta { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--tenue); margin-top: 5px; white-space: normal; }
  .msg.nos .meta { color: #BDB6B2; }
  .msg img { display: block; max-width: 220px; border-radius: 10px; margin-top: 6px; }
  .sep { align-self: center; font-size: 11px; color: var(--tenue); background: #F1EDE9; padding: 3px 10px; border-radius: 999px; }
  .pie { padding: 12px 20px max(16px, env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 10px; }
  .cuadro { display: flex; align-items: flex-end; gap: 10px; border: 1px solid #DDD; border-radius: 22px; padding: 6px 6px 6px 8px; background: #fff; }
  .cuadro.nota { background: var(--nota); border-color: var(--nota-b); }
  .cuadro textarea { flex: 1; min-width: 0; border: 0; resize: none; background: transparent; font: 500 14px/1.45 Montserrat, sans-serif; color: var(--tinta); outline: none; padding: 9px 4px; max-height: 160px; min-height: 40px; }
  .por { position: relative; flex: none; align-self: center; }
  .por button { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 0 10px; min-height: 36px; background: #F3F0EC; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap; }
  .por .menu { position: absolute; bottom: calc(100% + 8px); left: 0; background: #fff; border-radius: 16px; box-shadow: 0 20px 40px -20px rgba(60,40,30,.5); padding: 6px; min-width: 280px; z-index: 5; }
  .por .menu button { width: 100%; background: transparent; justify-content: flex-start; border-radius: 10px; min-height: 44px; text-align: left; white-space: normal; }
  .por .menu button:hover, .por .menu button.on { background: #F6F3F0; }
  .por .menu small { display: block; color: var(--tenue); font-weight: 500; font-size: 11px; }
  .enviar { width: 42px; height: 42px; border-radius: 50%; border: 0; background: #1F1F1F; color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
  .enviar:disabled { opacity: .4; }
  .ventana { font-size: 11.5px; color: var(--tenue); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ventana button { border: 0; background: transparent; color: var(--durazno-t); font-weight: 600; font-size: 11.5px; cursor: pointer; padding: 6px 0; min-height: 32px; }
  .perfil { background: #fff; border-left: 1px solid var(--linea); padding: max(22px, env(safe-area-inset-top)) 18px 22px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .perfil .quien { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .perfil h3 { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--tenue); margin: 0 0 4px; }
  .perfil .cnl { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #F5F2EF; font-size: 12.5px; }
  .perfil .cnl span.d { margin-left: auto; color: var(--tenue); font-size: 11px; text-align: right; }
  .perfil .cnl button { border: 0; background: transparent; color: var(--tenue); font-size: 11px; cursor: pointer; padding: 4px 0 4px 8px; min-height: 32px; }
  .perfil .mas { border: 0; background: transparent; color: var(--rojo); font-weight: 600; cursor: pointer; padding: 10px 0; text-align: left; min-height: 40px; }
  .perfil select { width: 100%; min-height: 40px; border-radius: 12px; border: 1px solid #E5DFD8; background: #FAF8F6; font: 600 12.5px Montserrat, sans-serif; color: var(--tinta); padding: 0 10px; }
  .tarj { background: #FAF8F6; border-radius: 14px; padding: 12px; font-size: 12.5px; }
  .tarj a { color: var(--durazno-t); font-weight: 600; }
  .perfil .cerrar { display: none; align-self: flex-end; border: 0; background: #F3F0EC; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
  .hoja { position: fixed; inset: 0; background: rgba(40,30,25,.32); display: grid; place-items: center; z-index: 40; padding: 16px; }
  .hoja > div { background: #fff; border-radius: 22px; padding: 18px; width: min(440px, 100%); max-height: 80vh; overflow-y: auto; box-shadow: 0 30px 60px -30px rgba(40,25,20,.6); }
  .hoja h4 { margin: 0 0 10px; font: 400 22px Valky, Georgia, serif; }
  .hoja .it { display: flex; align-items: center; gap: 10px; padding: 10px 6px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; min-height: 48px; }
  .hoja .it:hover { background: #F6F3F0; }
  .hoja input { width: 100%; min-height: 42px; border-radius: 12px; border: 1px solid #E5DFD8; padding: 0 12px; font: 500 14px Montserrat, sans-serif; margin-bottom: 8px; }

  /* sin la ficha (iPad vertical o computadora chica): la ficha se abre como panel */
  @media (max-width: 1239px) and (min-width: 701px) {
    .app { grid-template-columns: 200px minmax(280px, 330px) 1fr; }
    .perfil { position: fixed; right: 0; top: 0; bottom: 0; width: 320px; z-index: 30; box-shadow: -20px 0 40px -24px rgba(60,40,30,.45); transform: translateX(105%); transition: transform .32s var(--ease); }
    .perfil.abierto { transform: none; }
    .perfil .cerrar { display: grid; place-items: center; }
  }
  @media (max-width: 979px) and (min-width: 701px) {
    .app { grid-template-columns: minmax(280px, 330px) 1fr; }
    .rail { display: none; }
    .chips { display: flex; }
    .hilo { padding: 16px; }
  }
  @media (min-width: 1240px) { .solo-chico { display: none !important; } }

  /* ═══ C · iPhone: Alma decide el orden ═══ */
  .tel { display: none; }
  @media (max-width: 700px) {
    .app { display: none; }
    .tel { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: linear-gradient(180deg, #EFE6E2 0%, #FAF8F6 38%); }
    .tel .hola { display: flex; align-items: center; gap: 12px; padding: max(18px, env(safe-area-inset-top)) 16px 6px; }
    .tel .hola h1 { font-size: 21px; line-height: 1.15; margin: 0; }
    .tel .hola h1 em { font-style: normal; color: var(--rojo); }
    .tel .volver { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.75); text-decoration: none; color: var(--tinta); flex: none; align-self: flex-start; }
    .tel .cuerpo { flex: 1; overflow-y: auto; padding: 8px 16px 110px; }
    .tel h2 { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--tenue); display: flex; align-items: center; gap: 8px; margin: 10px 2px 10px; font-weight: 700; }
    .tel h2 .badge { background: #1F1F1F; }
    .foco { background: #fff; border-radius: 26px; padding: 18px; box-shadow: 0 30px 60px -36px rgba(80,50,40,.45); display: flex; flex-direction: column; gap: 12px; }
    .foco .quien { display: flex; align-items: center; gap: 12px; }
    .foco .quien b { font-size: 21px; line-height: 1.05; display: block; }
    .foco .quien small { display: block; color: var(--tenue); margin-top: 4px; font-size: 12px; }
    .foco .quien .pill { margin-left: auto; align-self: flex-start; }
    .foco .dijo { font-size: 19px; line-height: 1.3; }
    .mini { display: flex; flex-direction: column; gap: 6px; border-left: 2px solid #F1EDE9; padding-left: 12px; }
    .mini div { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; color: #6F6867; }
    .mini div .cn { margin-top: 1px; }
    .foco .acc { display: flex; gap: 8px; flex-wrap: wrap; }
    .foco .acc .btn { flex: 1; justify-content: center; }
    .foco .nota-pie { font-size: 11.5px; color: var(--tenue); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .foco .pasar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--tenue); }
    .foco .pasar button { border: 0; background: transparent; color: var(--durazno-t); font-weight: 600; min-height: 40px; cursor: pointer; }
    .tar { background: #fff; border-radius: 18px; padding: 12px 14px; display: flex; gap: 11px; box-shadow: 0 10px 24px -20px rgba(80,50,40,.5); margin-bottom: 10px; cursor: pointer; width: 100%; border: 0; text-align: left; }
    .tar .m { flex: 1; min-width: 0; font-size: 12.5px; }
    .tar .m b { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
    .tar .m b small { margin-left: auto; color: var(--tenue); font-weight: 500; font-size: 11px; }
    .tar .m p { color: #6F6867; margin: 3px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tar .m .alma { margin-top: 6px; padding: 7px 10px; border-radius: 12px; background: #F6F3F0; color: var(--tinta); }
    .tar .m .pie2 { display: flex; gap: 6px; margin-top: 6px; font-size: 11px; color: var(--durazno-t); font-weight: 600; }
    .tar.tenue { opacity: .75; box-shadow: none; background: rgba(255,255,255,.6); }
    .nav-tel { position: fixed; left: 16px; right: 16px; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: center; background: rgba(255,253,251,.86); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 999px; padding: 6px; box-shadow: 0 10px 30px -18px rgba(60,40,30,.5); z-index: 10; }
    .nav-tel button { flex: 1; border: 0; background: transparent; font-size: 11.5px; font-weight: 600; color: var(--tenue); min-height: 44px; border-radius: 999px; cursor: pointer; }
    .nav-tel button.on { color: var(--tinta); background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    /* el hilo de una persona, en pantalla completa */
    .tel-hilo { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--fondo); transform: translateX(100%); transition: transform .32s var(--ease); }
    .tel-hilo.abierto { transform: none; }
    .tel-hilo .conv { height: 100%; }
    .tel-hilo .atras { display: block; }
    .tel-hilo .conv .cab .acc .btn:not(.siempre) { display: none; }
    .tel-hilo .hilo { padding: 14px; }
    .tel-hilo .msg { max-width: 86%; }
    .tel-hilo .pie { padding: 10px 12px max(14px, env(safe-area-inset-bottom)); }
    .tel-hilo .por .menu { min-width: 250px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<!-- A · iPad y computadora -->
<div class="app" id="app">
  <nav class="rail" id="rail" aria-label="Carpetas y canales"></nav>
  <section class="lista" aria-label="Personas">
    <div class="top">
      <label class="buscar"><span aria-hidden="true">🔍</span><input id="buscar" type="search" placeholder="Buscar personas, mensajes, reservas…" autocomplete="off" aria-label="Buscar"></label>
      <div class="chips" id="chips"></div>
