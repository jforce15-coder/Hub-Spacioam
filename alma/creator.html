<!doctype html>
<html lang="es">
<head>
<script src="https://hub.spacioam.com/js/sa-sesion.js"></script>
<meta charset="utf-8">

<title>Modo Creator · Alma</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">

<!-- Modo Creator (Juan, 18-nov-2026, #770: «la vista creator la vamos a ver cuando se esté hablando con Claudio… nos
     debería abrir esa app en la que estamos trabajando y deberíamos poder navegar en ella… Es muy importante ver muy bien
     cuándo publicar y cuándo todavía está en draft»). La app que se trabaja (Hub, Hola, Epi, Grow, Docs, Mi) se ve en
     BORRADOR: una copia guardada en el Hub con los cambios que aún no están en vivo, pintada en un marco aislado (sin la
     sesión de Juan, sin datos reales, sin formularios; los enlaces de la misma app se abren aquí, los de fuera no).
     Arriba siempre dice si ves el BORRADOR o lo EN VIVO; se puede comparar. Cada frase a Claudio (voz) o escrita aquí es
     un cambio chico que se ve en segundos. Publicar va en dos pasos: «Preparar para publicar» (el PR con capturas) y, ya
     listo, «Publicar» (une ese PR). apps-script/creator.js. Solo el principal. -->
<style>
  :root { color-scheme: light; --tinta: #3E3F3F; --suave: #6F6867; --tenue: #A39B93; --linea: rgba(62,63,63,.10);
    --arena: #F3EEE9; --c1: #FFB25E; --c2: #E66A0E; --c-t: #9A4A0B; --c-f: #FFF4EA;
    --vivo: #2F6B4C; --vivo-f: #E2F0E6; --mal: #9E3326; --ease: cubic-bezier(.23,1,.32,1); --panel: 360px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; color: var(--tinta); font: 14.5px/1.5 Montserrat, system-ui, sans-serif; background: var(--arena); -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  button, input, select { font: inherit; color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--c2); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 1fr var(--panel); height: 100%; gap: 14px;
    padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

  /* La escena: barra con el estado y la vista */
  .escena { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .barra { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .redondo { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); display: grid; place-items: center; text-decoration: none; color: var(--tinta); cursor: pointer; transition: transform 140ms var(--ease); }
  .redondo:active { transform: scale(.94); }
  .redondo svg { width: 20px; height: 20px; }
  .tit { flex: 1; min-width: 0; }
  .tit b { display: block; font: 600 15px/1.2 Montserrat, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tit small { display: block; font: 500 11.5px/1.3 Montserrat, sans-serif; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* El sello: BORRADOR o EN VIVO, siempre a la vista */
  .sello { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px; border-radius: 999px; font: 700 11px/1 Montserrat, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  .sello i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .sello.borrador { color: var(--c-t); background: repeating-linear-gradient(-45deg, #FFE9D3 0 8px, #FFF4EA 8px 16px); box-shadow: inset 0 0 0 1.5px rgba(230,106,14,.55); }
  .sello.vivo { color: var(--vivo); background: var(--vivo-f); box-shadow: inset 0 0 0 1.5px rgba(47,107,76,.4); }
  .sello.vivo i { animation: late 2s var(--ease) infinite; }
  @keyframes late { 50% { opacity: .35; } }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.7); flex: none; }
  .seg button { min-height: 38px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font: 600 11.5px Montserrat, sans-serif; color: var(--suave); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--tinta); box-shadow: 0 1px 4px rgba(60,40,35,.12); }
  .vistas { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 12px; }
  .vistas.lado { grid-template-columns: 1fr 1fr; }
  .marco { position: relative; min-width: 0; min-height: 0; border-radius: 22px; overflow: hidden; background: #fff; }
  .marco.borrador { box-shadow: 0 0 0 2px rgba(230,106,14,.75), 0 24px 48px -32px rgba(60,40,35,.5); }
  .marco.vivo { box-shadow: 0 0 0 2px rgba(47,107,76,.55), 0 24px 48px -32px rgba(60,40,35,.5); }
  .cinta { position: absolute; z-index: 4; left: 14px; bottom: 14px; padding: 6px 12px; border-radius: 999px; font: 700 10px/1 Montserrat, sans-serif; letter-spacing: .14em; text-transform: uppercase; pointer-events: none; }
  .marco.borrador .cinta { color: #fff; background: var(--c2); }
  .marco.vivo .cinta { color: #fff; background: var(--vivo); }
  .marcos { position: absolute; inset: 0; }
  .marcos iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; transition: opacity 320ms var(--ease); }
  .marcos iframe.entra { opacity: 0; }
  .esq { position: absolute; inset: 0; padding: 28px; display: grid; align-content: start; gap: 14px; background: #fff; }
  .esq i { display: block; height: 16px; border-radius: 8px; background: linear-gradient(90deg, #F1ECE7, #F8F4F0, #F1ECE7); background-size: 200% 100%; animation: brillo 1.4s linear infinite; }
  .esq i:nth-child(1) { width: 46%; height: 26px; } .esq i:nth-child(2) { width: 30%; } .esq i:nth-child(n+3) { height: 70px; border-radius: 14px; }
  @keyframes brillo { to { background-position: -200% 0; } }
  .trabajo { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 5; max-width: calc(100% - 28px); display: flex; align-items: center; gap: 10px;
    padding: 9px 14px 9px 10px; border-radius: 999px; background: rgba(255,255,255,.84); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 10px 28px -16px rgba(60,40,35,.55); font: 500 12.5px/1.3 Montserrat, sans-serif; transition: opacity 200ms var(--ease), transform 260ms var(--ease); }
  .trabajo.fuera { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }
  .trabajo span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gira { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid rgba(230,106,14,.25); border-top-color: var(--c2); animation: gira .8s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .barrido { position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 5; overflow: hidden; }
  .barrido::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--c2), transparent); animation: barre 1.1s var(--ease) infinite; }
  @keyframes barre { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  /* El panel: la app, lo que falta por publicar, lo pedido y el cuadro */
  .panel { min-height: 0; display: flex; flex-direction: column; border-radius: 22px; background: rgba(255,255,255,.62); -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 0 0 1px rgba(255,255,255,.4), 0 24px 48px -34px rgba(60,40,35,.55); overflow: hidden; }
  .p-cab { display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px; }
  .c { flex: none; width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; color: #fff; font: 600 13px Montserrat, sans-serif; background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 0 0 3px rgba(255,178,94,.3); }
  .p-cab .q { flex: 1; min-width: 0; }
  .p-cab b { display: block; font: 600 14px/1.2 Montserrat, sans-serif; }
  .p-cab small { display: block; font: 500 11px/1.3 Montserrat, sans-serif; color: var(--suave); }
  .p-cab select { min-height: 38px; max-width: 120px; border: 0; border-radius: 999px; padding: 0 12px; background: #fff; box-shadow: inset 0 0 0 1px var(--linea); font: 600 12px Montserrat, sans-serif; }
  .falta { margin: 4px 12px 8px; padding: 12px 14px; border-radius: 16px; background: var(--c-f); box-shadow: inset 0 0 0 1px rgba(230,106,14,.25); }
  .falta b { display: block; font: 600 13px/1.35 Montserrat, sans-serif; color: var(--c-t); }
  .falta ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .falta li button { min-height: 30px; padding: 0 10px; border-radius: 999px; border: 0; background: #fff; font: 500 11.5px Montserrat, sans-serif; cursor: pointer; }
  .falta.listo { background: var(--vivo-f); box-shadow: inset 0 0 0 1px rgba(47,107,76,.3); } .falta.listo b { color: var(--vivo); }
  .falta.nada { background: rgba(255,255,255,.55); box-shadow: none; } .falta.nada b { color: var(--suave); font-weight: 500; }
  .lista { flex: 1; min-height: 0; overflow: auto; padding: 4px 12px 12px; -webkit-overflow-scrolling: touch; }
  .ver { position: relative; display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 10px 10px 34px; border-radius: 14px; cursor: pointer; transition: background 160ms var(--ease); }
  .ver:hover { background: rgba(255,255,255,.6); }
  .ver::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 2px; background: var(--linea); }
  .ver:first-child::before { top: 18px; } .ver:last-child::before { bottom: calc(100% - 18px); }
  .ver::after { content: ""; position: absolute; left: 9px; top: 13px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px var(--tenue); }
  .ver[aria-current="true"] { background: #fff; box-shadow: 0 1px 6px rgba(60,40,35,.08); }
  .ver[aria-current="true"]::after { background: var(--c2); box-shadow: 0 0 0 3px rgba(230,106,14,.25); }
  .ver.fuera-rama { opacity: .5; }
  .ver.vivo::after { background: var(--vivo); box-shadow: 0 0 0 3px rgba(47,107,76,.2); }
  .ver q { display: block; font: 600 13px/1.4 Montserrat, sans-serif; quotes: "«" "»"; }
  .ver p { margin: 3px 0 0; font-size: 12.5px; color: var(--suave); }
  .ver small { display: block; margin-top: 4px; font: 600 10px Montserrat, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
  .ver.nueva { animation: aparece 380ms var(--ease); }
  @keyframes aparece { from { opacity: 0; transform: translateY(6px); } }
  .pie { padding: 10px 12px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--linea); display: grid; gap: 8px; }
  .pie > * { min-width: 0; }
  .escribir { display: flex; gap: 8px; min-width: 0; }
  .escribir input { flex: 1; width: 100%; min-width: 0; min-height: 46px; padding: 0 14px; border-radius: 999px; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--linea); font-size: 16px; }
  .b { min-height: 46px; padding: 0 16px; flex: none; border-radius: 999px; border: 0; font: 600 13px Montserrat, sans-serif; cursor: pointer; transition: transform 140ms var(--ease), opacity 160ms; }
  .b:active { transform: scale(.97); }
  .b:disabled { opacity: .45; cursor: default; }
  .b.p { color: #fff; background: linear-gradient(160deg, var(--c1), var(--c2)); }
  .b.v { color: #fff; background: var(--vivo); }
  .b.s { background: rgba(255,255,255,.9); box-shadow: inset 0 0 0 1px var(--linea); }
  .botones { display: grid; grid-template-columns: auto 1fr; gap: 8px; }
  .aviso { margin: 0; font-size: 12.5px; color: var(--suave); }
  .aviso.mal { color: var(--mal); }

  /* Teléfono: la vista arriba, el panel abajo; lado a lado no cabe */
  @media (max-width: 899px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
    .barra { flex-wrap: wrap; }
    .tit { flex-basis: calc(100% - 56px); }
    .seg #ver-lado { display: none; }
    .barra { row-gap: 8px; column-gap: 8px; }
    .sello { flex: 1; justify-content: center; min-width: 0; padding: 0 10px; letter-spacing: .06em; font-size: 10px; }
    .sello span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button { padding: 0 10px; }
    .vistas.lado { grid-template-columns: 1fr; }
    .panel { max-height: 44vh; }
    .lista { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 12px 10px; scroll-snap-type: x proximity; }
    .ver { flex: none; width: 230px; padding: 10px 12px; scroll-snap-align: start; background: rgba(255,255,255,.55); }
    .ver::before, .ver::after { display: none; }
    .ver p { display: none; }   /* en el teléfono, solo lo pedido: el resumen lo dice Claudio */
    .ver[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--c2); }
    .p-cab { padding: 10px 14px 4px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .marcos iframe, .trabajo, .ver, .b, .redondo { transition: none; }
    .esq i, .barrido::after, .ver.nueva, .sello.vivo i { animation: none; }
    .gira { animation-duration: 2.4s; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="escena" aria-label="La app">
    <div class="barra">
      <a class="redondo" id="volver" href="claudio.html" aria-label="Volver al hilo de Claudio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div class="tit"><b id="titulo">Modo Creator</b><small id="sub">Cargando…</small></div>
      <span class="sello borrador" id="sello" role="status"><i aria-hidden="true"></i><span id="sello-t">BORRADOR · no publicado</span></span>
      <div class="seg" role="group" aria-label="Qué ver">
        <button type="button" id="ver-borrador" aria-pressed="true">Borrador</button>
        <button type="button" id="ver-vivo" aria-pressed="false">En vivo</button>
        <button type="button" id="ver-lado" aria-pressed="false">Lado a lado</button>
      </div>
    </div>
    <div class="vistas" id="vistas">
      <div class="marco borrador" id="m-borrador">
        <div class="barrido" id="barrido" hidden></div>
        <div class="trabajo fuera" id="trabajo" role="status" aria-live="polite"><i class="gira" aria-hidden="true"></i><span id="trabajo-t"></span></div>
        <div class="marcos" id="f-borrador"><div class="esq" id="esq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
        <span class="cinta">Borrador</span>
      </div>
      <div class="marco vivo" id="m-vivo" hidden>
        <div class="marcos" id="f-vivo"></div>
        <span class="cinta">En vivo</span>
      </div>
    </div>
  </section>

  <aside class="panel" aria-label="Lo pedido y cómo publicar">
    <div class="p-cab"><span class="c" aria-hidden="true">C</span><div class="q"><b>Modo Creator</b><small id="cuenta">Háblale a Claudio o escribe abajo</small></div>
      <select id="app" aria-label="App que trabajas"></select></div>
    <div class="falta nada" id="falta"><b id="falta-t">Igual que en vivo: todavía no hay cambios.</b><ul id="falta-l"></ul></div>
    <div class="lista" id="lista"></div>
    <div class="pie">
      <form class="escribir" id="forma" autocomplete="off">
        <input id="texto" type="text" enterkeyhint="send" placeholder="Pide un cambio: «el título más grande»" aria-label="Pide un cambio">
        <button class="b p" id="mandar" type="submit">Cambiar</button>
      </form>
      <div class="botones">
        <button class="b s" id="deshacer" type="button" aria-label="Regresar a la versión anterior">Regresar</button>
        <button class="b p" id="publicar" type="button">Preparar para publicar</button>
      </div>
      <p class="aviso" id="aviso" role="status" hidden></p>
    </div>
  </aside>
</div>
<script>
(function () {
  "use strict";
  var URL_HUB = "https://script.google.com/macros/s/AKfycbycTV0MsPWym02-ZcbpBBtwg9-WLw8dK9SAEDBslPd_9mgmizPQJS4-B_Q4uEkTWFqQ/exec";
  var $ = function (id) { return document.getElementById(id); };
  var QUIETO = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var EN_APP = /[?&]app=1\b/.test(location.search);
  var S = { sello: "", clave: "", claveVivo: "", ver: "borrador", ocupado: false, reloj: 0, vistos: {}, primera: true, c: null };
  if (EN_APP) $("volver").hidden = true;   // en la app, lo cierra el botón de la app (la llamada sigue abajo)

  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function pedir(accion, extra) {
    if (window.ALMA_CREATOR) return Promise.resolve(window.ALMA_CREATOR(accion, extra || {}));   // para probar la página con datos de ejemplo
    var ses = window.SASesion && SASesion.leer && SASesion.leer();
    if (!ses) return Promise.resolve({ ok: false, error: "Entra primero al Hub con tu usuario y vuelve a abrir esta página." });
    return fetch(URL_HUB, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, cache: "no-store", body: JSON.stringify(Object.assign({ hub: 1, action: accion, session: ses }, extra || {})) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: "No pude conectar con el Hub. Revisa tu internet." }; });
  }
  function aviso(t, mal) { var a = $("aviso"); a.textContent = t || ""; a.className = "aviso" + (mal ? " mal" : ""); a.hidden = !t; }
  function trabajando(t) { $("trabajo-t").textContent = t ? "Cambiando: «" + t + "»" : ""; $("trabajo").classList.toggle("fuera", !t); $("barrido").hidden = !t; }
  function seg(x) { return x ? String(x).replace(".", ",") + " s" : ""; }

  /* Una vista: el marco nuevo carga detrás y aparece encima. Aislado: sin el mismo origen, sin formularios, sin salir. */
  function pintar(caja, html) {
    var f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts"); f.setAttribute("title", caja.id === "f-vivo" ? "Así está en vivo" : "Borrador"); f.setAttribute("referrerpolicy", "no-referrer");
    f.className = "entra";
    f.onload = function () {
      var viejos = Array.prototype.filter.call(caja.querySelectorAll("iframe"), function (x) { return x !== f; });
      requestAnimationFrame(function () { f.classList.remove("entra"); });
      setTimeout(function () { viejos.forEach(function (x) { x.remove(); }); var e = $("esq"); if (e && caja.id === "f-borrador") e.remove(); }, QUIETO ? 0 : 340);
    };
    f.srcdoc = html; caja.appendChild(f);
  }
  /* El sello de arriba: lo que estás viendo, siempre. */
  function sello() {
    var c = S.c || {}, vivo = S.ver === "vivo", s = $("sello"), t = $("sello-t");
    s.className = "sello " + (vivo ? "vivo" : "borrador");
    t.textContent = vivo ? "EN VIVO · lo que ven todos" : c.estado === "publicado" ? "PUBLICADO · en vivo en un minuto" : c.estado === "listo" ? "BORRADOR · listo para publicar" : c.estado === "preparando" ? "BORRADOR · preparando" : "BORRADOR · no publicado";
    $("m-borrador").hidden = S.ver === "vivo"; $("m-vivo").hidden = S.ver === "borrador";
    $("vistas").classList.toggle("lado", S.ver === "lado");
    ["borrador", "vivo", "lado"].forEach(function (k) { $("ver-" + k).setAttribute("aria-pressed", String(S.ver === k)); });
  }
  function botonPublicar(c, falta) {
    var b = $("publicar");
    b.className = "b " + (c.estado === "listo" ? "v" : "p");
    b.textContent = c.estado === "listo" ? "Publicar" : c.estado === "preparando" ? "Preparando…" : c.estado === "publicado" ? "Publicado" : "Preparar para publicar";
    b.disabled = c.estado === "preparando" || c.estado === "publicado" || (c.estado === "borrador" && !falta);
  }
  function poner(r) {
    if (!r || !r.ok) { if (r && r.error) aviso(r.error, true); return; }
    trabajando(r.cambiando || "");
    if (r.igual) return;
    S.sello = r.sello; var c = S.c = r.creator;
    $("titulo").textContent = c.app_t + " · " + c.pagina.replace(/^alma\//, "");
    $("sub").textContent = r.pagina_cambiada ? "Esta pantalla tiene cambios sin publicar" : "Esta pantalla está igual que en vivo";
    var sel = $("app"); if (!sel.options.length) (r.apps || []).forEach(function (a) { var o = el("option", "", a.t); o.value = a.k; sel.appendChild(o); });
    sel.value = c.app;
    var clave = c.id + ":" + c.actual + ":" + c.pagina;
    if (clave !== S.clave || !document.querySelector("#f-borrador iframe")) { S.clave = clave; pintar($("f-borrador"), r.html); }
    if (r.html_vivo && (c.id + ":" + c.pagina) !== S.claveVivo) { S.claveVivo = c.id + ":" + c.pagina; pintar($("f-vivo"), r.html_vivo); }
    /* Lo que falta por publicar */
    var f = $("falta"), n = r.sin_publicar || 0;
    f.className = "falta" + (c.estado === "listo" || c.estado === "publicado" ? " listo" : n ? "" : " nada");
    $("falta-t").textContent = c.estado === "publicado" ? "Publicado: ya está en vivo (o en un minuto)." : c.estado === "listo" ? "Listo para publicar: " + n + (n === 1 ? " cambio" : " cambios") + ". Toca Publicar cuando quieras." :
      c.estado === "preparando" ? "Preparando para publicar " + n + (n === 1 ? " cambio" : " cambios") + ". Sigue en borrador." :
      n ? "Sin publicar: " + n + (n === 1 ? " cambio" : " cambios") + " en " + r.cambiados.length + (r.cambiados.length === 1 ? " pantalla" : " pantallas") : "Igual que en vivo: todavía no hay cambios.";
    var ul = $("falta-l"); ul.textContent = "";
    (c.estado === "publicado" ? [] : r.cambiados || []).forEach(function (p) { var li = el("li"), b = el("button", "", p.replace(/^alma\//, "")); b.type = "button"; b.onclick = function () { accion("creatorIr", { ruta: p }, ""); }; li.appendChild(b); ul.appendChild(li); });
    lista(r.versiones || [], c);
    botonPublicar(c, n);
    sello();
    if (r.error_ultimo && !r.cambiando) aviso(r.error_ultimo, true);
    S.primera = false;
  }
  function lista(vers, c) {
    var l = $("lista"); l.textContent = "";
    vers.slice().reverse().forEach(function (v) {
      var b = el("button", "ver" + (v.en_borrador ? "" : " fuera-rama") + (S.vistos[v.v] || S.primera ? "" : " nueva")); b.type = "button";
      if (v.v === c.actual) b.setAttribute("aria-current", "true");
      b.appendChild(el("q", "", v.pedido));
      if (v.resumen) b.appendChild(el("p", "", v.resumen));
      b.appendChild(el("small", "", "Versión " + v.v + " · " + v.archivo.replace(/^alma\//, "") + (v.segundos ? " · " + seg(v.segundos) : "") + (v.origen === "voz" ? " · por voz" : "")));
      b.onclick = function () { if (v.v !== c.actual) accion("creatorDeshacer", { v: v.v }, "Volviendo a la versión " + v.v); };
      l.appendChild(b); S.vistos[v.v] = 1;
    });
    var vivo = el("button", "ver vivo" + (c.actual === 0 ? "" : "")); vivo.type = "button";
    if (c.actual === 0) vivo.setAttribute("aria-current", "true");
    vivo.appendChild(el("q", "", "Como está en vivo")); vivo.appendChild(el("small", "", "Versión 0 · sin cambios"));
    vivo.onclick = function () { if (c.actual !== 0) accion("creatorDeshacer", { v: 0 }, "Volviendo a como está en vivo"); };
    l.appendChild(vivo);
    var n = vers.filter(function (v) { return v.en_borrador; }).length;
    $("cuenta").textContent = n ? "Estás en la versión " + c.actual + " · " + n + (n === 1 ? " cambio" : " cambios") : "Háblale a Claudio o escribe abajo";
    $("deshacer").disabled = !c.actual;
  }
  function mirar() {
    clearTimeout(S.reloj);
    if (document.hidden) return;
    var gen = S.gen = (S.gen || 0) + 1;   // una sola ronda de preguntas a la vez
    pedir("creatorVer", { desde: S.sello, vivo: S.ver !== "borrador" }).then(function (r) { if (gen === S.gen) poner(r); }).then(function () { if (gen === S.gen) S.reloj = setTimeout(mirar, 1500); });
  }
  function accion(nombre, extra, cartel) {
    if (S.ocupado) return;
    S.ocupado = true; aviso(""); trabajando(cartel);
    Array.prototype.forEach.call(document.querySelectorAll(".pie .b"), function (b) { b.disabled = true; });
    return pedir(nombre, extra).then(function (r) {
      S.ocupado = false; trabajando("");
      Array.prototype.forEach.call(document.querySelectorAll(".pie .b"), function (b) { b.disabled = false; });
      if (!r || !r.ok) aviso((r && r.error || "No se pudo.").replace(/^NO CAMBIÓ NADA: /, "No cambió nada: ").replace(/^NO SE PIDIÓ NADA: /, ""), true);
      else if (r.sin_cambio) aviso(r.resultado);
      else if (nombre === "creatorPublicar" && r.estado === "preparando") aviso("Se está preparando para publicar (con capturas antes y después). Sigue en BORRADOR; te aviso cuando esté listo.");
      else if (nombre === "creatorPublicar" && r.estado === "publicado") aviso("Publicado: en vivo en un minuto más o menos.");
      S.sello = ""; mirar();
    });
  }
  /* Un toque en un enlace dentro del borrador: la misma app se abre aquí; otro sitio no. */
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.creator === "ir" && d.ruta) accion("creatorIr", { ruta: d.ruta }, "");
    else if (d.creator === "fuera") aviso("Ese enlace sale de la app: en el borrador no se abre.");
  });
  $("forma").onsubmit = function (e) { e.preventDefault(); var t = $("texto").value.trim(); if (!t) return; $("texto").value = ""; accion("creatorCambiar", { texto: t }, t); };
  $("deshacer").onclick = function () { accion("creatorDeshacer", {}, "Regresando a la anterior"); };
  $("publicar").onclick = function () { accion("creatorPublicar", {}, S.c && S.c.estado === "listo" ? "Publicando" : "Pidiendo que se prepare"); };
  $("app").onchange = function () { accion("creatorAbrir", { app: this.value }, ""); };
  function ver(k) { S.ver = k; try { localStorage.setItem("creator_ver", k); } catch (e) {} sello(); S.sello = ""; S.claveVivo = ""; mirar(); }
  $("ver-borrador").onclick = function () { ver("borrador"); }; $("ver-vivo").onclick = function () { ver("vivo"); }; $("ver-lado").onclick = function () { ver("lado"); };
  try { var g = localStorage.getItem("creator_ver"); if (g === "vivo" || g === "lado") S.ver = g; } catch (e) {}
  document.addEventListener("visibilitychange", function () { if (!document.hidden) mirar(); });
  window.saRefrescar = function () { S.sello = ""; mirar(); };
  sello(); mirar();
})();
</script>
