     Google) y Reportes (llamadas) quedan como detalle de Google y de ElevenLabs. Solo el administrador principal
     (apps-script/gasto.js, acción «gasto»). Los montos nunca están en este repo: llegan del Hub.

      t2.appendChild(el("span", d >= 0 ? "sube" : "baja", "mes pasado · " + (d >= 0 ? "▲ " : "▼ ") + Math.abs(pc) + " % con la proyección")); }
    else { t2.appendChild(el("b", "", "—")); t2.appendChild(el("span", "", "mes pasado: todavía sin registro (empieza a guardarse este mes)")); }
    dos.appendChild(t1); dos.appendChild(t2); C.appendChild(dos);
    /* 2 · en qué se va: proveedores de mayor a menor */
    C.appendChild(sec("En qué se va el gasto de Alma", "toca uno para ver el detalle"));
    var pv = el("div", "provs"); (R.proveedores || []).forEach(function (P, i) { pv.appendChild(proveedor(P, i === 0)); }); C.appendChild(pv);
    /* 3 · equipo de ahorro */
    C.appendChild(sec("Equipo de ahorro", "Pareto 80/20 · solo el gasto de Alma"));
    C.appendChild(ahorro(R.ahorro || []));
    /* 4 · empresa: su propia caja y su propio total (no suma al de Alma) */
    var E = R.empresa;
    if (E && ((E.proveedores || []).length || (E.partes || []).some(function (X) { return (X.proveedores || []).length; }))) {
      var bx = el("section", "empresa"); bx.setAttribute("aria-label", "Gastos de Spacio AM como empresa, aparte del gasto de Alma");
      bx.appendChild(el("span", "aparte", "Aparte · no es gasto de Alma"));
      bx.appendChild(el("h2", "", "Gastos de Spacio AM (empresa)"));
      var tt = el("div", "tot", usd(E.usd)), eu = (E.sin_usd || []).map(otra);
      var ts = el("small"); if (eu.length) { ts.appendChild(document.createTextNode("más ")); ts.appendChild(el("span", "eur", eu.join(" + ") + " · falta USD")); ts.appendChild(document.createTextNode(". ")); }
      ts.appendChild(document.createTextNode("Construir Alma y operar Spacio AM. No suma al gasto de Alma de arriba.")); tt.appendChild(ts); bx.appendChild(tt);
      (E.partes || [{ titulo: "", proveedores: E.proveedores }]).forEach(function (X) {
        if (!(X.proveedores || []).length) return;
        if (X.titulo) { var ph = el("div", "parte"), xe = (X.sin_usd || []).map(otra); ph.appendChild(el("h3", "", X.titulo)); ph.appendChild(el("b", "", usd(X.usd) + (xe.length ? " + " + xe.join(" + ") : "")));
          if (X.que) ph.appendChild(el("p", "", X.que)); bx.appendChild(ph); }
        var nv = el("div", "provs"); X.proveedores.forEach(function (P) { nv.appendChild(proveedor(P, false, true)); }); bx.appendChild(nv);
      });
      C.appendChild(bx);
    }
    /* 5 · total general: solo referencia */
    if (R.general) {
      var gn = el("div", "general"), ge = (R.general.sin_usd || []).map(otra);
      gn.appendChild(el("b", "", "Total general (solo referencia)")); gn.appendChild(el("div", "m", usd(R.general.usd) + (ge.length ? " + " + ge.join(" + ") : "")));
      gn.appendChild(el("p", "", "Alma + empresa juntos. El número que importa para Alma es el de arriba.")); C.appendChild(gn);
    }
    C.appendChild(el("p", "nota", "Medido: sale de un recibo o del registro de cada llamada a la IA. Estimado: calculado (reparto o tarifa). Falta dato: escribe el monto en su detalle. Actualizado " +
      new Date(R.actualizado || Date.now()).toLocaleString("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) + "."));
    requestAnimationFrame(function () { requestAnimationFrame(function () { Array.prototype.forEach.call(document.querySelectorAll(".prov .riel i"), function (i) { i.style.width = i.getAttribute("data-w"); }); }); });
  }

  function proveedor(P, top, negocio) {
    var c = el("section", "prov" + (top ? " top" : "")), b = el("button"); b.type = "button";
    c.setAttribute("aria-expanded", String(!!abierto[P.id]));
    var nom = el("div", "nom", P.nombre); nom.appendChild(el("small", "", P.que)); b.appendChild(nom);
    var eu = (P.sin_usd || []).map(otra), soloEu = P.estado === "falta_usd";
    var mon = el("div", "mon", P.estado === "falta" ? "—" : soloEu ? eu.join(" + ") : usd(P.usd));
    mon.appendChild(el("small", "", P.estado === "falta" ? "falta dato" : soloEu ? "al mes · falta USD" : eu.length ? "+ " + eu.join(" + ") + " · falta USD" : (R.actual && Math.abs(P.proyeccion - P.usd) > 0.5 ? "cierra en " + usd(P.proyeccion) : ESTADO[P.estado] || ""))); b.appendChild(mon);
    var fl = el("span", "flecha"); fl.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>'; b.appendChild(fl);
    if (!negocio && P.estado !== "falta") { var ri = el("div", "riel"), p = el("div", "p"), i = el("i"); i.setAttribute("data-w", Math.max(P.usd ? 1.5 : 0, P.pct || 0) + "%"); p.appendChild(i); ri.appendChild(p); ri.appendChild(el("em", "", es.format(P.pct || 0) + " %")); b.appendChild(ri); }
    b.setAttribute("aria-label", P.nombre + ", " + (P.estado === "falta" ? "falta dato" : soloEu ? eu.join(" + ") + ", falta el valor en dólares" : usd(P.usd) + (negocio ? ", gasto de la empresa" : ", " + es.format(P.pct || 0) + " % del gasto de Alma")) + ". Toca para ver el detalle.");
    b.onclick = function () { abierto[P.id] = !abierto[P.id]; c.setAttribute("aria-expanded", String(abierto[P.id])); if (abierto[P.id] && !det.firstChild) llenar(det, P); };
    var det = el("div", "det"); c.appendChild(b); c.appendChild(det);
    if (abierto[P.id]) llenar(det, P);
    return c;
  }

  function llenar(det, P) {
    det.innerHTML = "";
    var D = P.detalle || {};
    if (P.id === "elevenlabs") detElevenLabs(det, D, P);
    else if (P.id === "anthropic") detClaude(det, D);
    else if (P.id === "google") detGoogle(det, D);
    else if (P.id === "claude_plan" && D.microproyectos != null) { var cf = el("div", "cifras"); cifra(cf, es.format(D.microproyectos), "pedidos a Claudio este mes"); cifra(cf, es.format(D.unidos || 0), "ya unidos"); det.appendChild(cf);
      det.appendChild(el("p", "nota", "Claudio corre con el plan de Claude: no cobra por token. Mientras más pedidos, más cerca del límite del plan.")); }
    /* Las líneas (planes, recargas) con su fuente, y escribir lo que falta */
    det.appendChild(el("h3", "", "De dónde sale"));
    var ls = el("div", "lineas");
    (P.lineas || []).forEach(function (l) {
      var f = el("div", "linea"), t = el("b", "", l.nombre); t.appendChild(el("small", "", l.tipo === "año" ? "anual ÷ 12" : l.tipo === "una_vez" ? "una vez" + (l.fecha ? " · " + l.fecha : "") : l.tipo === "uso" ? "por uso" : "al mes"));
      f.appendChild(t); var m = el("div", "m"); m.appendChild(document.createTextNode(l.usd == null ? (l.monto != null && l.moneda ? otra(l) + "  " : "—  ") : usd(l.usd) + "  ")); m.appendChild(chip(l.estado)); f.appendChild(m);
      if (l.fuente || l.nota) f.appendChild(el("p", "", [l.fuente, l.nota].filter(Boolean).join(" · ")));
      if (l.id && l.tipo !== "uso") { var ed = el("button", "btn", l.estado === "falta_usd" ? "Escribir en US$" : l.usd == null ? "Escribir monto" : "Corregir"); ed.type = "button"; ed.onclick = function () { formulario(det, P, l); }; f.appendChild(ed); }
      ls.appendChild(f);
    });
    det.appendChild(ls);
    var nuevo = el("button", "btn", "+ Agregar un plan o recarga"); nuevo.type = "button"; nuevo.onclick = function () { formulario(det, P, null); }; det.appendChild(nuevo);
  }

  function detElevenLabs(det, D, P) {
    if (D.error) { det.appendChild(el("p", "nota", D.error)); return; }
    if ((D.avisos || []).length) det.appendChild(el("p", "nota", "ElevenLabs no dio todo: " + D.avisos.join(" · ")));
    var cf = el("div", "cifras");
    cifra(cf, es.format(D.minutos || 0), "minutos de llamada"); cifra(cf, es.format(D.conversaciones || 0), "conversaciones");
    cifra(cf, D.usd_min != null ? usd(D.usd_min) : "—", "por minuto, en promedio"); if (D.llm_pct != null) cifra(cf, D.llm_pct + " %", "de los créditos se va en el LLM");
    det.appendChild(cf);
    if (D.llm_pct != null) {
      det.appendChild(el("h3", "", "Dónde se consumen los créditos"));
      var pi = el("div", "pila"); pi.setAttribute("role", "img"); pi.setAttribute("aria-label", "LLM " + D.llm_pct + " %, voz y lo demás " + (100 - D.llm_pct) + " %");
      var a = el("i", "l"), v = el("i", "v"); a.style.width = D.llm_pct + "%"; v.style.width = (100 - D.llm_pct) + "%"; pi.appendChild(a); pi.appendChild(v); det.appendChild(pi);
      var ly = el("div", "ley"), s1 = el("span", "", "LLM (lo que piensa) " + D.llm_pct + " %"), s2 = el("span", "", "Voz y lo demás " + (100 - D.llm_pct) + " %");
      s1.style.setProperty("--c", "var(--llm)"); s2.style.setProperty("--c", "var(--voz)"); ly.appendChild(s1); ly.appendChild(s2); det.appendChild(ly);
    }
    det.appendChild(el("h3", "", "Por agente"));
    det.appendChild(barras(D.agentes || [], function (x) { return x.creditos; }, function (x) { return x.usd != null ? usd(x.usd) : es.format(x.creditos) + " cr"; }, function (x) { return es.format(x.minutos) + " min"; }));
    det.appendChild(el("h3", "", "Por canal"));
    det.appendChild(barras(D.canales || [], function (x) { return x.creditos; }, function (x) { return x.usd != null ? usd(x.usd) : es.format(x.creditos) + " cr"; }, function (x) { return es.format(x.minutos) + " min"; }));
    if ((D.caras || []).length) {
      det.appendChild(el("h3", "", "Las llamadas que más costaron"));
      var cs = el("div", "caras");
      D.caras.forEach(function (x) { var f = el("div", "cara"), d = new Date(x.fecha);
        f.appendChild(el("div", "", x.agente + " · " + x.canal)); f.appendChild(el("b", "", x.usd != null ? usd(x.usd) : es.format(x.creditos) + " cr"));
        f.appendChild(el("span", "", (isNaN(d) ? "" : d.toLocaleDateString("es", { day: "numeric", month: "short" }) + " · ") + es.format(Math.round(x.minutos * 10) / 10) + " min" + (x.llm_pct != null ? " · LLM " + x.llm_pct + " %" : ""))); cs.appendChild(f); });
      det.appendChild(cs);
    }
    if (D.plan) {
      det.appendChild(el("h3", "", "Créditos del plan " + D.plan.nivel));
      var pct = D.plan.creditos_limite ? Math.min(100, Math.round(100 * D.plan.creditos_usados / D.plan.creditos_limite)) : 0;
      var me = el("div", "medidor"), mi = el("i"); mi.style.width = pct + "%"; me.appendChild(mi); det.appendChild(me);
      det.appendChild(el("p", "nota", es.format(D.plan.creditos_usados) + " de " + es.format(D.plan.creditos_limite) + " créditos (" + pct + " %)" + (D.plan.reinicio ? ". Se reinician el " + new Date(D.plan.reinicio).toLocaleDateString("es", { day: "numeric", month: "long" }) : "") + "."));
    }
    det.appendChild(el("p", "nota", D.nota || ""));
    var ir = el("a", "ir", "Calidad de las llamadas (reporte semanal) ›"); ir.href = "reporte.html"; det.appendChild(ir);
  }
  function detClaude(det, D) {
    var cf = el("div", "cifras"), tk = D.tokens || {};
    cifra(cf, es.format(D.n || 0), "pedidos a la IA"); cifra(cf, es.format(Math.round(((tk.entrada || 0) + (tk.salida || 0) + (tk.cache || 0)) / 1000)) + " mil", "tokens");
    cifra(cf, es.format(Math.round((tk.cache || 0) / 1000)) + " mil", "de caché (más baratos)"); det.appendChild(cf);
    det.appendChild(el("h3", "", "Por función"));
    det.appendChild(barras((D.funciones || []).slice(0, 12), function (x) { return x.usd; }, function (x) { return usd(x.usd); }, function (x) { return es.format(x.n) + " veces"; }));
    det.appendChild(el("h3", "", "Por modelo"));
    det.appendChild(barras(D.modelos || [], function (x) { return x.usd; }, function (x) { return usd(x.usd); }));
    det.appendChild(el("p", "nota", "Cada llamada a la IA del Hub queda en el registro con sus tokens y su precio. Lo de la consola y otras llaves no entra aquí."));
  }
  function detGoogle(det, D) {
    if (!D || D.ok === false) { det.appendChild(el("p", "nota", "No pude leer los cupos de Google.")); }
    else {
      var cf = el("div", "cifras"); cifra(cf, (D.hoy_pct || 0) + " %", "del cupo de hoy usado"); cifra(cf, es.format(D.usado_hoy || 0), "de " + es.format(D.limite || 0) + " llamadas a internet"); det.appendChild(cf);
      det.appendChild(el("h3", "", "Cupos por app · 7 días"));
      det.appendChild(barras(D.apps_semana || [], function (x) { return x.llamadas; }, function (x) { return es.format(x.llamadas); }));
      det.appendChild(el("p", "nota", "El cupo no cuesta dinero, pero si se acaba, Alma pausa lo de fondo."));
    }
    var ir = el("a", "ir", "Ver los cupos de hoy por hora ›"); ir.href = "uso.html"; det.appendChild(ir);
  }

  function formulario(det, P, l) {
    var viejo = det.querySelector(".form"); if (viejo) viejo.remove();
    var f = el("form", "form");
    var nom = el("input"); nom.value = l ? l.nombre : ""; nom.placeholder = "Qué es (Plan, Recarga…)"; nom.className = "ancho"; nom.setAttribute("aria-label", "Qué es");
    var mon = el("input"); mon.inputMode = "decimal"; mon.placeholder = "Monto"; mon.value = l && l.usd != null ? String(l.usd) : ""; mon.setAttribute("aria-label", "Monto");
    var mo = el("select"); [["USD", "US$"], ["EUR", "EUR (sin convertir)"]].forEach(function (x) { var o = el("option", "", x[1]); o.value = x[0]; mo.appendChild(o); }); mo.value = "USD"; mo.setAttribute("aria-label", "Moneda");
    var tipo = el("select"); tipo.className = "ancho"; [["mes", "Al mes"], ["año", "Al año"], ["una_vez", "Una vez"]].forEach(function (x) { var o = el("option", "", x[1]); o.value = x[0]; tipo.appendChild(o); }); tipo.value = l && l.tipo ? l.tipo : "mes"; tipo.setAttribute("aria-label", "Cada cuánto");
    var fe = el("input"); fe.type = "date"; fe.className = "ancho"; fe.value = l && l.fecha ? l.fecha : new Date().toISOString().slice(0, 10); fe.setAttribute("aria-label", "Fecha (para una vez) o desde cuándo");
    var bt = el("button", "", "Guardar"); bt.type = "submit";
    [nom, mon, mo, tipo, fe, bt].forEach(function (x) { f.appendChild(x); });
    f.onsubmit = function (ev) {
      ev.preventDefault(); bt.disabled = true; bt.textContent = "Guardando…";
      var b = { prov: P.id, nombre: nom.value || "Plan", usd: mo.value === "USD" ? mon.value : "", tipo: tipo.value, fuente: "Juan en la pantalla" };
      if (mo.value !== "USD") { b.moneda = mo.value; b.monto = mon.value; }
      if (l && l.id) b.id = l.id; if (tipo.value === "una_vez") b.fecha = fe.value; else b.desde = fe.value;
      pedir("gastoPlanFijar", b).then(function (r) { if (!r || !r.ok) { bt.disabled = false; bt.textContent = (r && r.error) || "No se pudo"; return; } abierto[P.id] = true; cargar(true); });
    };
    det.appendChild(f); mon.focus();
  }

  function ahorro(L) {
    var caja = el("div", "ahorro");
    var rg = el("div", "regla"); rg.innerHTML = "Cada lunes el equipo toma lo poco que suma el <b>80 %</b> del gasto por uso y abre un microproyecto para bajarlo. <b>Ninguno se une sin la compuerta de calidad</b>: los mismos casos reales antes y después, con el mismo resultado útil. Si la calidad baja, se descarta.";
    caja.appendChild(rg);
    if (!L.length) { caja.appendChild(el("p", "nota", "Todavía no hay proyectos: el primero sale el lunes.")); return caja; }
    var EST = { propuesto: "Propuesto", "en trabajo": "En trabajo", "en revisión": "En revisión", unido: "Unido", descartado: "Descartado" };
    L.forEach(function (x) {
      var c = el("div", "proy"), cab = el("div", "cab"); cab.appendChild(el("b", "", x.lugar));
      cab.appendChild(chip(x.estado === "unido" ? "unido" : x.estado === "descartado" ? "descartado" : "estimado", EST[x.estado] || x.estado));
      cab.appendChild(chip(x.calidad === "pendiente" ? "" : x.calidad, x.calidad === "pendiente" ? "Calidad por medir" : "Calidad " + x.calidad)); c.appendChild(cab);
      c.appendChild(el("p", "", x.hipotesis));
      var nm = el("div", "num"), a = el("div"), b = el("div"), d = el("div");
      a.appendChild(el("b", "", es.format(x.pct_gasto) + " %")); a.appendChild(el("span", "", "del gasto por uso"));
      b.appendChild(el("b", "", x.ahorro_esperado_pct + " %")); b.appendChild(el("span", "", "ahorro esperado"));
      d.appendChild(el("b", "", x.ahorro_medido_pct == null ? "—" : es.format(x.ahorro_medido_pct) + " %")); d.appendChild(el("span", "", "ahorro medido"));
      [a, b, d].forEach(function (y) { nm.appendChild(y); }); c.appendChild(nm);
      c.appendChild(el("p", "", "Cómo se mide la calidad: " + x.calidad_como));
      if (x.pr) { var ir = el("a", "ir", "Ver el cambio ›"); ir.href = x.pr; ir.target = "_blank"; ir.rel = "noopener"; c.appendChild(ir); }
      caja.appendChild(c);
    });
    return caja;
  }

  function cargar(fresco) {
    pedir("gasto", fresco ? { fresco: 1 } : {}).then(function (r) {
      if (!r || !r.ok) { var C = $("cuerpo"); C.innerHTML = ""; var v = el("div", "vacio", "No pude cargar el gasto."); v.appendChild(el("p", "", (r && r.error) || "Intenta de nuevo en un momento.")); C.appendChild(v); return; }
      R = r; pintar();
    });
  }
  $("b-recargar").onclick = function () { cargar(true); };
  cargar(false);
})();
</script>
