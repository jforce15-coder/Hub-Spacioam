<!doctype html>
<html lang="es">
<head>
<script src="https://hub.spacioam.com/js/sa-sesion.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alma</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32.png">
<link rel="stylesheet" href="../ds/tokens/fonts.css">
<link rel="stylesheet" href="../ds/tokens/colors.css">
<link rel="stylesheet" href="../ds/tokens/typography.css">
<!-- «Alma aquí»: Alma sola, abierta desde cualquier página con el atajo de Compartir o el marcador
     (instalar.html). Recibe qué estaba viendo la persona (?t=título&sel=texto&desde=<url>, desde al final)
     y se lo pasa a Alma como contexto, en el chat y en la voz. -->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg, #F4F1EC); color: var(--fg, #1D1D1B); font-family: var(--font-sans, -apple-system, system-ui, sans-serif);
    min-height: 100dvh; display: flex; flex-direction: column; }
  header { padding: max(16px, env(safe-area-inset-top)) 16px 12px; border-bottom: 1px solid var(--border-soft, #e4ded5); background: var(--surface, #fff); }
  h1 { font-family: var(--font-serif, Georgia, serif); font-weight: 400; font-size: 26px; margin: 0; }
  .viendo { margin-top: 6px; font-size: 13px; color: var(--fg-muted, #6f6867); overflow-wrap: anywhere; }
  .viendo a { color: inherit; }
  .sel { margin-top: 6px; font-size: 13px; padding: 6px 10px; border-left: 3px solid var(--accent, #B54D36); background: var(--bg-alt, #efe9e0); border-radius: 4px; max-height: 5.5em; overflow: auto; }
  .captura { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted, #6f6867); }
  .captura img { width: 54px; height: 96px; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--border-soft, #e4ded5); flex: none; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .yo { align-self: flex-end; background: var(--fg, #1D1D1B); color: var(--fg-inverse, #fff); border-bottom-right-radius: 4px; }
  .alma { align-self: flex-start; background: var(--surface, #fff); border: 1px solid var(--border-soft, #e4ded5); border-bottom-left-radius: 4px; }
  .nota { align-self: center; color: var(--fg-muted, #6f6867); font-size: 13px; text-align: center; }
  /* El nuevo chat (#304): «+» · cuadro (hasta 5 líneas) · micrófono (vacío) o enviar (con texto) · roca. Enter salta de línea. */
  footer { padding: 10px 12px max(12px, env(safe-area-inset-bottom)); background: var(--surface, #fff); border-top: 1px solid var(--border-soft, #e4ded5); display: flex; gap: 6px; align-items: flex-end; }
  .caja { flex: 1; min-width: 0; position: relative; display: flex; border-radius: 24px; }
  textarea { flex: 1; min-width: 0; resize: none; font: inherit; font-size: 16px; line-height: 20px; height: 48px; padding: 13px 14px; box-sizing: border-box; border-radius: 24px; border: 1px solid var(--border, #d6cfc4); background: var(--bg, #F4F1EC); max-height: 126px; overflow-y: hidden; outline: none; }
  button { font: inherit; border: 0; border-radius: 999px; height: 48px; min-width: 48px; padding: 0; cursor: pointer; display: grid; place-items: center; flex: none; -webkit-tap-highlight-color: transparent; transition: transform .1s, background .18s; }
  button:active { transform: scale(.92); }
  #mas { background: transparent; color: var(--fg, #1D1D1B); }
  #mic, #enviar { width: 48px; background: var(--fg, #1D1D1B); color: var(--fg-inverse, #fff); }
  #enviar { display: none; }
  footer.lleno #mic { display: none; } footer.lleno #enviar { display: grid; }
  .rocaw { position: relative; flex: none; }
  #roca { width: 48px; border: 1px solid #E9826A; background: rgba(233,130,106,.14); }
  #roca.vivo { background: #E9826A; animation: graba 1.2s ease-in-out infinite; }
  #roca.vivo svg { fill: #fff; }
  @keyframes graba { 50% { box-shadow: 0 0 0 10px rgba(233,130,106,.2); } }
  .tip { position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%); padding: 6px 11px; border-radius: 999px; background: var(--fg, #1D1D1B); color: #fff; font-size: 11px; font-weight: 500; white-space: nowrap; pointer-events: none; display: none; }
  footer.lleno .tip { display: block; }
  body.con-roca .tip { display: none !important; }
  button:disabled { opacity: .45; }
  .entrar { margin: 40px auto; max-width: 360px; text-align: center; line-height: 1.5; }
  .entrar a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 999px; background: var(--fg, #1D1D1B); color: #fff; text-decoration: none; }
</style>
<link rel="stylesheet" href="../ds/esqueleto.css">
</head>
<body>
<header>
  <h1>Alma</h1>
  <div class="viendo" id="viendo">Abierta sin página de origen.</div>
  <div class="sel" id="sel" hidden></div>
  <div class="captura" id="captura" hidden></div>
</header>
<main id="hilo"><div class="sa-esq" aria-label="Cargando la conversación" style="width: 100%"><i class="b"></i><i class="b yo"></i><i class="b"></i></div></main>
<footer id="pie">
  <button id="mas" type="button" aria-label="Plantillas" title="Plantillas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <div class="caja" id="caja"><textarea id="txt" rows="1" placeholder="Escríbele a Alma…" enterkeyhint="enter" aria-label="Mensaje para Alma"></textarea></div>
  <button id="mic" type="button" aria-label="Dictar: toca y habla" title="Dictar: toca y habla"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button id="enviar" type="button" aria-label="Enviar" title="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:block; margin-left:2px"><path d="M4.5 12 3 4.5l17.5 7.5L3 19.5z"/><path d="M4.5 12H11"/></svg></button>
  <div class="rocaw"><span class="tip" aria-hidden="true">Mejorar</span><button id="roca" type="button" data-sa-dock="1" aria-label="Alma" title="Un toque: mejorar · dos toques: hablar con Alma"><svg width="18" height="18" viewBox="0 0 24 24" fill="#E9826A" aria-hidden="true"><path d="M12 2.5c.7 4.7 2.8 6.8 7.5 7.5-4.7.7-6.8 2.8-7.5 7.5-.7-4.7-2.8-6.8-7.5-7.5 4.7-.7 6.8-2.8 7.5-7.5z"/></svg></button></div>
</footer>
<script src="../js/sa-auth-client.js"></script>
<script src="../js/alma-client.js"></script>
<script src="../js/sa-compositor.js?v=2026-11-09b"></script>
<script src="../js/sa-nav.js?v=2026-11-10c"></script>
<script src="../js/alma-voz.js?v=2026-11-01b"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  /* desde va al final y puede venir sin codificar (atajo de Compartir): es todo lo que sigue a «desde=». */
  var q = location.search.slice(1), i = q.indexOf("desde="), antes = i >= 0 ? q.slice(0, i) : q;
  var p = new URLSearchParams(antes), desde = i >= 0 ? q.slice(i + 6) : "";
  try { if (/%[0-9A-F]{2}/i.test(desde)) desde = decodeURIComponent(desde); } catch (e) {}
  var titulo = (p.get("t") || "").slice(0, 200), sel = (p.get("sel") || "").slice(0, 1500);
  if (desde) {
    var a = document.createElement("a"); a.href = desde; a.textContent = titulo || desde; a.target = "_blank"; a.rel = "noopener";
    $("viendo").textContent = "Estás viendo: "; $("viendo").appendChild(a);
  }
  if (sel) { $("sel").hidden = false; $("sel").textContent = "«" + sel + "»"; }

  /* Quién es: el correo va dentro de la sesión firmada (pulsera) que guarda sa-sesion.js. */
  function correo() {
    try { var s = window.SAAuth && SAAuth.session ? SAAuth.session() : null; if (!s) return "";
      var c = s.slice(0, s.lastIndexOf(".")).replace(/-/g, "+").replace(/_/g, "/");
      return String(JSON.parse(decodeURIComponent(escape(atob(c + "===".slice((c.length + 3) % 4))))).e || "").toLowerCase();
    } catch (e) { return ""; }
  }
  var yo = correo();
  if (!yo) {
    $("pie").hidden = true;
    $("hilo").innerHTML = '<div class="entrar">Para hablar con Alma, entra primero al Hub con tu cuenta. Después vuelve a abrir este enlace.<br><a href="https://hub.spacioam.com/">Entrar al Hub</a></div>';
    return;
  }
  var ctx = desde ? ("Estoy viendo la página «" + (titulo || desde) + "» (" + desde + ")" + (sel ? " y seleccioné este texto: «" + sel + "»" : "") + ".") : "";
  var ctxEnviado = false;

  /* Triple toque a Alma en el navegador de la app: la app manda una captura de la pantalla. Alma la «ve» (el Hub la
     describe) y toda la conversación va con ese contexto: en el primer mensaje escrito y en la voz. */
  var captura = "", capturaP = null;
  window.AlmaCaptura = function (du) {
    if (!/^data:image\//.test(String(du || ""))) return;
    var c = $("captura"); c.hidden = false; c.innerHTML = "";
    var img = document.createElement("img"); img.src = du; img.alt = "Captura de la pantalla"; c.appendChild(img);
    var t = document.createElement("span"); t.textContent = "Alma está viendo tu pantalla…"; c.appendChild(t);
    $("txt").placeholder = "Pregúntale a Alma sobre lo que ves…";
    capturaP = ALMA.almaFoto(du, true).then(function (j) {
      captura = j && j.ok && j.texto ? j.texto : "";
      t.textContent = captura ? "Alma ya vio tu pantalla." : "No pude leer la captura.";
      if (captura) { ctxEnviado = false; ctx = (ctx ? ctx + " " : "") + "[Te mando una captura de mi pantalla. Lo que se ve: " + captura + "]"; }
    }, function () { t.textContent = "No pude leer la captura."; });
  };

  function pinta(lista) {
    var h = $("hilo"); h.innerHTML = "";
    if (!lista.length) { var n = document.createElement("div"); n.className = "nota"; n.textContent = desde ? "Pregúntale lo que quieras sobre esta página." : "Escríbele a Alma o tócale el micrófono."; h.appendChild(n); }
    lista.forEach(function (m) { var d = document.createElement("div"); d.className = "m " + (m.de === "yo" ? "yo" : "alma"); d.textContent = SAAlmaVoz.limpiar(m.texto || ""); h.appendChild(d); });
    h.scrollTop = h.scrollHeight;
  }
  var mensajes = [];
  ALMA.opHilo(yo, "").then(function (r) { mensajes = ((r && r.mensajes) || []).slice(-30); pinta(mensajes); }, function () { pinta([]); });

  function enviar() {
    var t = $("txt").value.trim(); if (!t) return;
    if (capturaP && !captura) { $("enviar").disabled = true; capturaP.then(function () { capturaP = null; $("enviar").disabled = false; enviar(); }); return; }
    var texto = !ctxEnviado && ctx ? ctx + "\n\n" + t : t; ctxEnviado = true;
    $("txt").value = ""; crecer(); $("enviar").disabled = true;
    mensajes = mensajes.concat([{ de: "yo", texto: t }, { de: "alma", texto: "…" }]); pinta(mensajes);
    ALMA.opEnviar(yo, texto).then(function (r) {
      mensajes.pop();
      mensajes.push({ de: "alma", texto: r && r.ok && r.alma ? r.alma.texto : "No pude responder ahora (" + ((r && r.error) || "sin conexión") + "). Intenta de nuevo." });
      pinta(mensajes);
    }).finally(function () { $("enviar").disabled = false; });
  }
  $("enviar").onclick = enviar;   // solo el botón envía: Enter salta de línea (el nuevo chat, #304)

  /* El cuadro crece hasta 5 líneas y luego hace scroll; con texto, el micrófono se cambia por enviar y aparece «Mejorar». */
  function crecer() {
    var t = $("txt"); t.style.height = "48px"; t.style.height = Math.min(126, t.scrollHeight + 2) + "px"; t.style.overflowY = t.scrollHeight + 2 > 126 ? "auto" : "hidden";
    var lleno = !!t.value.trim(); $("pie").classList.toggle("lleno", lleno); $("roca").setAttribute("aria-label", lleno ? "Mejorar" : "Alma");
  }
  function poner(t) { var x = $("txt"); x.value = t; crecer(); try { x.focus(); x.setSelectionRange(t.length, t.length); } catch (e) {} }
  $("txt").addEventListener("input", crecer);
  /* El micrófono: dicta al cuadro (js/sa-compositor.js); lo dicho queda escrito para revisarlo antes de enviar. */
  $("mic").onclick = function () {
    if (!window.SAComp) return;
    SAComp.dictar({ caja: $("caja"), onTexto: function (t) { var p = $("txt").value.replace(/\s+$/, ""); poner(p ? p + " " + t : t); } });
  };
  /* El «+»: mis plantillas (tocar una la pone en el cuadro, no la envía) y guardar este texto como plantilla. */
  $("mas").onclick = function () { if (window.SAComp) SAComp.mas({ ancla: $("mas"), texto: function () { return $("txt").value; }, poner: poner }); };

  /* Voz: el mismo agente del Hub; lo que hay en pantalla es la página de origen. */
  var voz = SAAlmaVoz.crear({ contexto: function () {
    return "EN PANTALLA: abrió a Alma desde «Alma aquí»" + (desde ? ", mientras veía la página «" + (titulo || desde) + "» (" + desde + ")" + (sel ? " con este texto seleccionado: «" + sel + "»" : "") : "") +
      (captura ? ". Mandó una captura de su pantalla; lo que se ve: " + captura : "") + ". Úsalo como contexto de lo que pregunte.";
  } });
  var llamada = null, abriendo = false;
  function hablar() {
    if (llamada) { llamada.end(); return; }
    if (abriendo) return; abriendo = true;
    voz.start({
      status: function (s) { $("roca").title = s; },
      message: function (src, t) { mensajes.push({ de: src === "ai" ? "alma" : "yo", texto: t }); pinta(mensajes); },
      ended: function () { llamada = null; $("roca").classList.remove("vivo"); $("roca").title = "Un toque: mejorar · dos toques: hablar con Alma"; },
      error: function (m) { mensajes.push({ de: "alma", texto: m }); pinta(mensajes); }
    }).then(function (c) { llamada = c; $("roca").classList.add("vivo"); },
      function (e) { mensajes.push({ de: "alma", texto: (e && e.message) || "No pude abrir la voz." }); pinta(mensajes); })
      .finally(function () { abriendo = false; });
  }
  /* La roca oficial (sa-nav, con su halo) se encaja en #roca y le pasa los toques a la página (alToques):
     1 toque mejora el texto (ALMA.mejorarTexto) · 2 toques, hablar con Alma (o colgar). Con la llamada abierta, 1 toque cuelga.
     Si sa-nav no cargó, el botón cuenta los toques él mismo. */
  var mejorando = false;
  function mejorar() {
    var x = $("txt"), t = x.value.trim(); if (!t || mejorando || !ALMA.mejorarTexto) return;
    mejorando = true; $("roca").style.opacity = ".5"; x.readOnly = true; var antes = x.value;
    ALMA.mejorarTexto(t, { pagina: "Alma aquí" + (titulo ? " · " + titulo : ""), etiqueta: "Mensaje para Alma", url: desde }).then(function (r) {
      mejorando = false; $("roca").style.opacity = ""; x.readOnly = false;
      if (r && r.ok && r.texto && x.value === antes) poner(r.texto);
    }, function () { mejorando = false; $("roca").style.opacity = ""; x.readOnly = false; });
  }
  function tocar(n) { if (n >= 2 || llamada) hablar(); else mejorar(); }
  var toques = 0, toqT = 0;
  $("roca").onclick = function () {
    toques++; clearTimeout(toqT);
    toqT = setTimeout(function () { var n = toques; toques = 0; tocar(n); }, 300);
  };
  if (window.SANav) {
    SANav.mount({ app: "alma", home: { k: "alma", l: "Alma" }, apps: [], items: [], alma: null, tutoriales: false, bienvenida: false, alToques: tocar });
    document.body.classList.add("con-roca");   // el hint «Mejorar» lo pinta sa-nav encima de la roca oficial
  }
  $("roca").addEventListener("dblclick", function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
