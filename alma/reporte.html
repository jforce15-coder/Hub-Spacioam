    if (V.cortas_10s) C.appendChild(el("p", "nota", es.format(V.cortas_10s) + " llamadas duraron menos de 10 s (abiertas por error o que no conectaron)."));
    /* conferencia */
    var cfz = D.conferencia || {};
    if (cfz.sesiones) {
      C.appendChild(sec("Modo conferencia"));
      var cc = el("div", "cifras");
      cifra(cc, es.format(cfz.sesiones), "sesiones · " + es.format(cfz.minutos || 0) + " min escuchando");
      cifra(cc, es.format((cfz.por_estado || {})["vacía"] || 0), "quedaron vacías");
      cifra(cc, es.format(cfz.reunion || 0), "fueron reuniones");
      cifra(cc, es.format(cfz.con_audio || 0), "con audio para separar voces");
      C.appendChild(cc);
    }
    C.appendChild(el("p", "nota", "Fuentes: ElevenLabs (todas las llamadas de la semana y una muestra leída turno por turno) y la hoja del Hub (chat con Alma, modo conferencia). Lo arma el equipo de Mejora de llamadas cada lunes."));
    if (location.hash === "#propuestas") { var px = document.getElementById("propuestas"); if (px) px.scrollIntoView(); }
  }
  function cargar(id) {
    ALMA.reporteLlamadas(id ? { id: id } : {}).then(function (r) {
      if (!r || !r.ok) { $("cuerpo").innerHTML = ""; $("cuerpo").appendChild(el("div", "vacio", (r && r.error) || "No pude cargar el reporte.")); return; }
      R = r; var s = $("semana"); s.innerHTML = "";
      (r.lista || []).forEach(function (x) { var o = el("option", "", x.semana); o.value = x.id; s.appendChild(o); });
      s.hidden = (r.lista || []).length < 2; if (r.reporte) s.value = r.reporte.id;
      pintar();
    });
  }
  $("semana").onchange = function () { cargar(this.value); };
  var q = new URLSearchParams(location.search); cargar(q.get("id") || "");
})();
